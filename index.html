<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CPG 病理推理：呼吸困難篇</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* Layout: one 1120px column under a sticky bar; each CPG = header + five sub-tabs; tools sit in two-column grids that stack on phones.
   Color roles: accent = 氧合藍（導覽與互動）；path = 病理（異常、警訊）；ok = 處置有效；adv = 進階層內容 */
:root{
  --bg:#f3f5f8; --surface:#ffffff; --ink:#132234; --muted:#5a6a7c; --line:#d6dde6; --soft:#e7effc;
  --accent:#1c5bcc; --accent-ink:#ffffff; --path:#c23b28; --path-soft:#fbe9e5; --ok:#147a55; --ok-soft:#e2f4ec; --adv:#6a47c2; --adv-soft:#efeafb;
  --display:"Noto Sans TC",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;
  --body:"Noto Sans TC",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0e1520; --surface:#16202c; --ink:#e4ebf3; --muted:#98a7b8; --line:#2a3747; --soft:#182a43;
    --accent:#6c9fff; --accent-ink:#0b1320; --path:#ff7b64; --path-soft:#3a1f1b; --ok:#4cc59a; --ok-soft:#14322a; --adv:#ad91ff; --adv-soft:#271f3f;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1520; --surface:#16202c; --ink:#e4ebf3; --muted:#98a7b8; --line:#2a3747; --soft:#182a43;
  --accent:#6c9fff; --accent-ink:#0b1320; --path:#ff7b64; --path-soft:#3a1f1b; --ok:#4cc59a; --ok-soft:#14322a; --adv:#ad91ff; --adv-soft:#271f3f;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.7;-webkit-text-size-adjust:100%}
h1,h2,h3,h4{font-family:var(--display);line-height:1.3;margin:0;text-wrap:balance}
h1{font-size:clamp(1.6rem,3.6vw,2.3rem);font-weight:900;letter-spacing:.01em}
h2{font-size:1.45rem;font-weight:900}
h3{font-size:1.1rem;font-weight:700}
p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}

/* top bar */
.bar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;gap:14px;min-height:58px;flex-wrap:wrap;padding-top:6px;padding-bottom:6px}
.brand{font-weight:900;font-size:1.02rem;text-decoration:none;color:var(--ink);display:flex;align-items:center;gap:8px;white-space:nowrap}
.brand i{width:22px;height:22px;border-radius:6px;background:var(--accent);display:inline-grid;place-items:center;color:var(--accent-ink);font-style:normal;font-size:.8rem;font-weight:900}
.nav{display:flex;gap:4px;flex-wrap:wrap;flex:1}
.nav a{padding:6px 10px;border-radius:8px;text-decoration:none;color:var(--muted);font-size:.92rem;font-weight:500;white-space:nowrap}
.nav a:hover{background:var(--soft);color:var(--ink)}
.nav a[aria-current="page"]{background:var(--soft);color:var(--accent);font-weight:700}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--bg);gap:2px}
.seg button{border:0;background:transparent;padding:5px 12px;border-radius:999px;cursor:pointer;font-size:.88rem;color:var(--muted);font-weight:500}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12);font-weight:700}
.seg button[data-v="adv"][aria-pressed="true"]{color:var(--adv)}

main{padding:28px 0 64px}
.stack{display:flex;flex-direction:column;gap:22px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media (max-width:820px){.grid2,.grid3{grid-template-columns:1fr}}
.lede{font-size:1.06rem;color:var(--muted);max-width:68ch}
.prose{max-width:68ch}
.eyebrow{font-size:.8rem;font-weight:700;color:var(--accent);letter-spacing:.06em}
.tag{display:inline-block;font-size:.76rem;padding:1px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.tag.adv{border-color:var(--adv);color:var(--adv);background:var(--adv-soft)}
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.btn.sm{padding:5px 10px;font-size:.88rem}

/* level gating */
body[data-level="basic"] .adv-only{display:none !important}
.advbox{border-left:3px solid var(--adv);background:var(--adv-soft);padding:10px 14px;border-radius:0 8px 8px 0;font-size:.95rem}
.advbox b.lv{color:var(--adv);font-size:.8rem;display:block;margin-bottom:2px}

/* home */
.hero{display:grid;grid-template-columns:1.25fr 1fr;gap:28px;align-items:center}
@media (max-width:820px){.hero{grid-template-columns:1fr}}
.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;counter-reset:s}
@media (max-width:820px){.steps{grid-template-columns:1fr 1fr}}
.step{border:1px solid var(--line);border-radius:var(--r);padding:12px;background:var(--surface);position:relative}
.step b{display:block;font-size:1rem}
.step span{font-size:.86rem;color:var(--muted);display:block;line-height:1.55}
.step .n{font-family:var(--mono);font-size:.78rem;color:var(--accent);font-weight:600}
.cpgcards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media (max-width:820px){.cpgcards{grid-template-columns:1fr}}
.cpgcard{display:flex;flex-direction:column;gap:8px;text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;border-top:4px solid var(--accent);transition:border-color .15s}
.cpgcard:hover{border-color:var(--accent)}
.cpgcard .top{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.cpgcard .en{font-family:var(--mono);font-size:.8rem;color:var(--muted)}
.cpgcard p{font-size:.93rem;color:var(--muted)}
.cpgcard .prog{font-size:.8rem;color:var(--ok);font-weight:700}
.idx{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media (max-width:820px){.idx{grid-template-columns:1fr}}
.idx h4{font-size:.95rem;margin-bottom:6px}
.idx ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px}
.idx li{font-size:.9rem;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.idx li a{color:var(--accent);font-weight:700;text-decoration:none}
.idx li .st{font-size:.74rem}
.idx li .st.done{color:var(--ok);font-weight:700}

/* cpg page */
.cpghead{display:flex;flex-direction:column;gap:10px}
.core{font-size:1.15rem;font-weight:700;border-left:4px solid var(--path);padding:4px 0 4px 14px;max-width:60ch}
.subtabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.subtabs button{border:0;background:none;padding:10px 14px;cursor:pointer;color:var(--muted);font-weight:500;border-bottom:3px solid transparent;margin-bottom:-1px}
.subtabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent);font-weight:700}

/* chain */
.chainwrap{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:18px;align-items:start}
@media (max-width:820px){.chainwrap{grid-template-columns:1fr}}
.chain{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:0}
.chain li{position:relative;padding-left:0}
.chain li+li::before{content:"";display:block;width:2px;height:14px;background:var(--line);margin-left:22px}
.node{width:100%;text-align:left;display:flex;gap:12px;align-items:center;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:10px 12px;cursor:pointer;transition:border-color .15s,background .15s}
.node:hover{border-color:var(--accent)}
.node .num{flex:0 0 26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--path-soft);color:var(--path);font-family:var(--mono);font-weight:600;font-size:.85rem}
.node .lbl{font-weight:700;line-height:1.4}
.node[aria-pressed="true"]{border-color:var(--path);background:var(--path-soft)}
.node.hl{border-color:var(--ok);box-shadow:0 0 0 2px var(--ok) inset}
.node.hl .num{background:var(--ok);color:var(--surface)}
.node.dim{opacity:.45}
.detail{position:sticky;top:80px;display:flex;flex-direction:column;gap:14px}
.detail h3{font-size:1.2rem}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:520px){.cols2{grid-template-columns:1fr}}
.lst h4{font-size:.82rem;color:var(--muted);font-weight:700;margin-bottom:4px;letter-spacing:.04em}
.lst ul{margin:0;padding-left:1.1em;font-size:.94rem}
.lst.sig h4{color:var(--path)}
.lst.tx h4{color:var(--ok)}
.drugrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{border:1px solid var(--line);background:var(--surface);padding:5px 12px;border-radius:999px;cursor:pointer;font-size:.9rem;font-weight:500}
.chip:hover{border-color:var(--ok)}
.chip[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:var(--surface);font-weight:700}
.chip.advc{border-style:dashed;border-color:var(--adv)}
.drugnote{font-size:.94rem;background:var(--ok-soft);border-radius:8px;padding:10px 14px}

/* models */
.model{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:18px;align-items:start}
@media (max-width:820px){.model{grid-template-columns:minmax(0,1fr)}}
.model>*,.grid2>*,.chainwrap>*{min-width:0}
.viz{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;overflow-x:auto}
.viz svg{display:block;width:100%;height:auto}
.ctl{display:flex;flex-direction:column;gap:14px}
.sl label{display:flex;justify-content:space-between;gap:8px;font-weight:700;font-size:.94rem}
.sl label output{font-family:var(--mono);color:var(--accent);font-weight:600}
.sl input[type=range]{width:100%;accent-color:var(--accent)}
.sl small{color:var(--muted);font-size:.82rem;display:block}
.meters{display:flex;flex-direction:column;gap:9px}
.meter{display:grid;grid-template-columns:7.5em 1fr 4.2em;gap:8px;align-items:center;font-size:.9rem}
.meter .trk{display:block;height:10px;background:var(--bg);border:1px solid var(--line);border-radius:999px;overflow:hidden}
.meter .fil{display:block;height:100%;background:var(--path);border-radius:999px;transition:width .25s}
.meter .fil.good{background:var(--ok)}
.meter .fil.acc{background:var(--accent)}
.meter .v{font-family:var(--mono);text-align:right;font-size:.85rem}
.status{border-radius:8px;padding:10px 14px;font-weight:700;background:var(--soft)}
.status.bad{background:var(--path-soft);color:var(--path)}
.status.ok{background:var(--ok-soft);color:var(--ok)}
.status.mid{background:#fff3d6;color:#8a5a00}
:root[data-theme="dark"] .status.mid{background:#3a2f14;color:#f2c25b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .status.mid{background:#3a2f14;color:#f2c25b}}
.toggles{display:flex;gap:8px;flex-wrap:wrap}
.vitals{display:flex;gap:8px;flex-wrap:wrap}
.vital{border:1px solid var(--line);border-radius:8px;padding:4px 10px;background:var(--bg);font-size:.86rem;display:flex;gap:6px;align-items:baseline}
.vital b{font-family:var(--mono);font-size:1rem}
.vital.bad b{color:var(--path)}
.formula{font-family:var(--mono);font-size:.86rem;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 12px;overflow-x:auto;white-space:nowrap}

/* why */
.qa{display:flex;flex-direction:column;gap:10px}
.qa details{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:0}
.qa summary{cursor:pointer;padding:14px 16px;font-weight:700;list-style:none;display:flex;gap:10px;align-items:flex-start}
.qa summary::-webkit-details-marker{display:none}
.qa summary::before{content:"Q";font-family:var(--mono);color:var(--accent);font-weight:600;flex:0 0 auto}
.qa details[open] summary{border-bottom:1px solid var(--line)}
.qa .ans{padding:12px 16px 16px 40px;display:flex;flex-direction:column;gap:10px}
.think{font-size:.88rem;color:var(--muted)}

/* case */
.case{display:flex;flex-direction:column;gap:14px}
.stage{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.stage .sh{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.stepbadge{font-size:.78rem;font-weight:700;padding:2px 10px;border-radius:999px;background:var(--soft);color:var(--accent)}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;border:1px solid var(--line);background:var(--bg);padding:10px 14px;border-radius:8px;cursor:pointer;font-weight:500}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt[disabled]{cursor:default}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--path);background:var(--path-soft)}
.fb{font-size:.94rem;border-radius:8px;padding:10px 14px}
.fb.ok{background:var(--ok-soft)}
.fb.no{background:var(--path-soft)}
.teach{font-size:.94rem;border-left:3px solid var(--accent);padding-left:12px}
.casebar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* traps */
.traps{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:640px){.traps{grid-template-columns:1fr}}
.trap{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--path);border-radius:var(--r);padding:14px 16px}
.trap b{display:block;margin-bottom:4px}
.trap p{font-size:.94rem;color:var(--muted)}

/* ddx */
.fgrid{display:flex;flex-wrap:wrap;gap:8px}
.fchip{border:1px solid var(--line);background:var(--surface);padding:6px 12px;border-radius:999px;cursor:pointer;font-size:.9rem}
.fchip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.rank{display:flex;flex-direction:column;gap:10px}
.rk{display:grid;grid-template-columns:9.5em 1fr 3.6em;gap:10px;align-items:center;font-size:.92rem}
.rk a{color:var(--ink);font-weight:700;text-decoration:none}
.rk a:hover{color:var(--accent)}
.rk .trk{display:block;height:14px;background:var(--bg);border:1px solid var(--line);border-radius:999px;overflow:hidden}
.rk .fil{display:block;height:100%;background:var(--accent);transition:width .3s}
.rk.top .fil{background:var(--path)}
.rk .v{font-family:var(--mono);text-align:right;font-size:.85rem}
.whylist{font-size:.9rem;margin:0;padding-left:1.1em;color:var(--muted)}
.vg{display:flex;flex-direction:column;gap:12px}
.vgopts{display:flex;flex-wrap:wrap;gap:8px}
.note{font-size:.88rem;color:var(--muted);border-top:1px solid var(--line);padding-top:10px}
/* v2：系統分類、教學分頁、模擬器 */
.search{font:inherit;padding:9px 14px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--ink);min-width:min(320px,100%)}
.search:focus{outline:3px solid var(--accent);outline-offset:1px}
.sech3{display:flex;gap:10px;align-items:baseline;border-bottom:2px solid var(--ink);padding-bottom:6px}
.sech3 span{font-size:.85rem;font-weight:400}
.pips{display:flex;gap:6px;flex-wrap:wrap}
.pips span{font-size:.74rem;color:var(--ok);font-weight:700;background:var(--ok-soft);padding:0 7px;border-radius:999px}
.cpgcard h3{font-size:1.05rem}
.crumb{display:flex;gap:8px;flex-wrap:wrap;font-size:.88rem;color:var(--muted)}
.crumb a{color:var(--accent);text-decoration:none}
.tabgroups{display:flex;flex-direction:column;gap:2px}
.subtabs .tg{align-self:center;font-size:.74rem;font-weight:700;color:var(--muted);letter-spacing:.08em;padding:0 8px 0 0;min-width:2.6em}
.subtabs.teach button[aria-selected="true"]{color:var(--adv);border-bottom-color:var(--adv)}
.pager{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:16px}
.pager a{text-decoration:none}
.simv{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
.sv{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--bg);display:flex;flex-direction:column;gap:0}
.sv span{font-size:.8rem;color:var(--muted)}
.sv b{font-size:1.35rem;line-height:1.3}
.sv b small{font-size:.7rem;color:var(--muted);font-weight:400}
.sv em{font-style:normal;font-size:.76rem;color:var(--muted)}
.sv.bad{border-color:var(--path);background:var(--path-soft)}
.sv.bad b{color:var(--path)}
.sv i{font-style:normal;font-family:var(--mono)}
.sv i.up{color:var(--accent)} .sv i.dn{color:var(--path)}
.simacts{display:flex;flex-direction:column;gap:8px}
.opt.used{opacity:.6}
.simlog{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:8px;font-size:.92rem}
.simlog li b{display:block}
.simlog li.ok b{color:var(--ok)} .simlog li.no b{color:var(--path)}
.ta{font:inherit;width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);resize:vertical;line-height:1.6}
.ta:focus{outline:3px solid var(--accent);outline-offset:1px}
.rub{border-collapse:collapse;width:100%;font-size:.9rem}
.rub th,.rub td{border:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}
.rub thead th{background:var(--bg);font-size:.84rem}
.rub.wide{min-width:640px}
.lst p{font-size:.95rem}
.tl{display:flex;flex-direction:column;gap:0;border-left:2px solid var(--line);margin-left:6px}
.tli{display:grid;grid-template-columns:7em 6.5em 1fr;gap:12px;align-items:baseline;padding:10px 0 10px 18px;position:relative}
.tli::before{content:"";position:absolute;left:-7px;top:16px;width:12px;height:12px;border-radius:50%;background:var(--accent)}
@media (max-width:640px){.tli{grid-template-columns:1fr}}
.qbar{display:block;height:6px;background:var(--line);border-radius:999px;overflow:hidden}
.qbar .fil{display:block;height:100%;background:var(--accent)}
@media (max-width:640px){.bar{position:static}}
/* v3：執行範圍標籤、指導員指南 */
.lvb{display:inline-block;font-size:.72rem;font-weight:700;padding:0 7px;border-radius:999px;border:1px solid;white-space:nowrap;vertical-align:middle;line-height:1.6}
.lv1{color:#0f6b4a;border-color:#0f6b4a;background:#e3f4ec}
.lv2{color:#1c5bcc;border-color:#1c5bcc;background:#e7effc}
.lvp{color:#6a47c2;border-color:#6a47c2;background:#efeafb}
.lvp3{color:#8a5a00;border-color:#b07700;background:#fff3d6}
.lvh{color:#5a6a7c;border-color:#8a97a6;background:#eef1f5}
.lva{color:#132234;border-color:#132234;background:transparent}
:root[data-theme="dark"] .lv1,:root[data-theme="dark"] .lv2,:root[data-theme="dark"] .lvp,:root[data-theme="dark"] .lvp3,:root[data-theme="dark"] .lvh{background:transparent;filter:brightness(1.6)}
:root[data-theme="dark"] .lva{color:var(--ink);border-color:var(--ink)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .lv1,:root:not([data-theme="light"]) .lv2,:root:not([data-theme="light"]) .lvp,:root:not([data-theme="light"]) .lvp3,:root:not([data-theme="light"]) .lvh{background:transparent;filter:brightness(1.6)}:root:not([data-theme="light"]) .lva{color:var(--ink);border-color:var(--ink)}}
.chip[aria-pressed="true"] .lvb{filter:none;background:var(--surface)}

const CPGS = [
/* ---------------------------------------------------------- 氣喘 */
{
  id:'asthma', zh:'氣喘急性發作', en:'Asthma', sec:'呼吸系統', model:'poiseuille',

     adv:'發炎分兩段：早期反應在數分鐘內出現（平滑肌收縮）；晚期反應在 4–8 小時後出現（嗜酸性球浸潤、黏膜水腫）。類固醇處理的是晚期反應，所以要早給，但不會馬上見效。',
     signs:['已知誘因或季節性','近期上呼吸道感染','過去需要住院或插管的病史'], tx:['移除誘因','詢問緩解劑使用次數與效果']},
    {t:'平滑肌收縮＋黏膜水腫＋黏液栓', d:'三件事同時讓氣道管徑變小。支氣管擴張劑只解決第一件事，水腫與黏液栓需要時間。',
     adv:'β2 受體活化 → cAMP 上升 → 平滑肌放鬆。Ipratropium 阻斷迷走神經（M3）造成的收縮與分泌，作用點不同，所以與 salbutamol 有加成效果。',
     signs:['喘鳴（wheeze）','呼氣延長','咳嗽、胸悶'], tx:['Salbutamol','Ipratropium']},
    {t:'氣道阻力急遽上升', d:'阻力與半徑的四次方成反比：管徑剩一半，阻力變成 16 倍。病人必須用很大的力氣才能讓空氣通過。',

     signs:['說話斷句（句子→片語→單字）','使用呼吸輔助肌、三凹','前傾坐姿（三腳架姿勢）'], tx:['讓病人維持舒適坐姿','氧氣滴定']},

     adv:'疲乏期常見：EtCO₂ 回升、意識改變、silent chest、心搏過緩。此時可考慮 IV adrenaline、magnesium；若需插管，ketamine 的支氣管擴張作用是常見選擇，通氣採 permissive hypercapnia。',
     signs:['SpO₂ 下降','EtCO₂ 回升','意識改變、疲倦、說不出話','silent chest（聽不到呼吸音）'], tx:['Adrenaline','Magnesium','準備輔助通氣']},
    {t:'低血氧＋胸內高壓 → 循環衰竭', d:'嚴重缺氧加上胸內壓壓迫回流，最後以 PEA 或心搏過緩停止收場。',
     adv:'氣喘的心跳停止要想到動態過度充氣：短暫中斷通氣讓氣體排出（必要時壓胸協助），並排除張力性氣胸（必要時雙側減壓）。',

  drugs:[

    {q:'給了支氣管擴張劑之後，喘鳴聲反而變大聲，是變糟了嗎？', a:'通常是變好。喘鳴需要氣流通過狹窄的管道才會出現。原本氣流太少（接近 silent chest），打開一些之後氣流回來，聲音就出現了。要搭配說話能力、呼吸功與 SpO₂ 一起判斷。'},
    {q:'病人越來越安靜、不太喘了，為什麼反而要緊張？', a:'安靜可能是疲乏，不是好轉。呼吸肌累了，換氣下降，CO₂ 上升，意識跟著變差。看 EtCO₂ 是否回升、病人能不能說話、呼吸音是否消失。'},
    {q:'需要 BVM 輔助通氣時，為什麼要擠得慢？', a:'這類病人的問題是氣吐不出來。擠太快，每一口都疊在上一口沒吐完的氣上面，胸內壓上升，血壓會掉，也可能造成氣胸。看到胸廓完全回落再給下一口。'},
    {q:'為什麼 salbutamol 給多了心跳會變快、手會抖？', a:'Salbutamol 會刺激心臟上的 β2 受體，並造成周邊血管擴張引起反射性心搏過速；高劑量時也有部分 β1 作用。β2 也會讓鉀離子進入細胞（低血鉀）並造成震顫。重度氣喘時這不是停藥的理由，但要監測心律。', adv:'大量 β2 致效劑還可能造成乳酸上升，代謝性酸中毒會驅使病人呼吸更快，容易被誤判為氣喘惡化。'},
    {q:'危及生命的氣喘，為什麼要改用 adrenaline？', a:'當氣流幾乎停止，霧化的藥到不了遠端氣道。肌肉注射的 adrenaline 經由血流抵達，同時具有 β2（擴張支氣管）與 α1（減輕黏膜水腫）作用。', adv:'劑量與途徑（IM/IV 輸注）依所屬機關指引。'}

  cases:[

    {q:'一位缺氧病人心跳從 130 下降到 50，最合理的解讀是？', opts:['缺氧改善，心臟放鬆了','即將心跳停止的危險訊號','迷走神經反射，不需處理','藥物作用'], a:1, exp:'缺氧造成的心搏過緩常是心跳停止前的最後階段。'},

{
  id:'perfusion', zh:'灌流狀態評估', en:'Perfusion Status Assessment', sec:'評估',
  core:'灌流是把氧氣送進細胞。血壓只是其中一個數字，而且是代償失敗後才掉的那一個。',
  chain:[
    {t:'起因：四種休克', d:'低血容（流失血液或體液）、心因性（幫浦壞了）、阻塞性（血流被擋住）、分布性（血管異常擴張）。四種都會讓組織拿不到足夠的氧氣。',
     adv:'阻塞性：張力性氣胸、心包填塞、大範圍肺栓塞。分布性：敗血症、過敏性休克、神經性休克（脊髓損傷，常合併心搏過緩與溫暖乾燥的皮膚）。分類的意義在於處置方向可能完全相反。',
     signs:['出血、嘔吐腹瀉','胸痛、心律不整','頸靜脈怒張','發燒、皮疹、過敏原暴露、脊椎外傷'], tx:['找出並處理起因：止血、解除阻塞、移除過敏原']},
    {t:'心輸出量或血管張力下降', d:'血壓大約等於心輸出量乘上血管阻力。心輸出量又由心跳與每次打出的血量（心搏量）決定。任一項下降，灌流壓就會受影響。',
     adv:'組織氧氣輸送（DO₂）= 心輸出量 × 動脈血氧含量。血氧含量主要由血紅素與 SaO₂ 決定，溶解的氧氣只佔極小部分。所以大量失血時，即使 SpO₂ 100%，送到細胞的氧氣仍然不足。',
     signs:['脈搏變弱、變快','SpO₂ 讀不到或波形差'], tx:['給氧（低血氧時）','控制出血']},
    {t:'代償：交感神經全面啟動', d:'壓力感受器偵測到壓力下降，交感神經讓心跳加快、心肌收縮變強、周邊血管收縮。皮膚與腸胃的血流被犧牲，留給心臟與大腦。',
     adv:'血管收縮使舒張壓上升，收縮壓卻因心搏量減少而下降，結果是脈壓變窄，這是低血容早期的線索。分布性休克則相反，舒張壓偏低、脈壓變寬，早期皮膚可能溫暖。',
     signs:['心搏過速','皮膚蒼白、濕冷','微血管再充填時間延長','脈壓變窄','呼吸加快','焦慮、口渴'], tx:['平躺','保暖']},
    {t:'血壓被撐住，器官已在缺氧', d:'代償期血壓可以維持「正常」，但腎臟、腸道、皮膚已經缺血。這是處置最有效的時期，也是最容易被忽略的時期。',
     adv:'休克指數（心跳 ÷ 收縮壓）大於約 1 提示明顯休克，比單看血壓敏感。教學上常說失血約三成以上收縮壓才會明顯下降，但個體差異很大，老人與用藥者可能更早或更晚。',
     signs:['焦躁或意識變鈍','尿量減少','休克指數升高'], tx:['縮短現場時間','預警醫院']},
    {t:'失代償：低血壓', d:'代償用盡，血壓開始下降。大腦灌流不足造成意識改變。到這裡，病人可能在短時間內崩潰。',
     adv:'創傷出血在止血前，常依指引採容許性低血壓（permissive hypotension）：維持足以保住意識與周邊脈搏的血壓，避免把血塊沖掉與稀釋凝血因子。頭部外傷是重要例外，需要較高的灌流壓。',
     signs:['收縮壓下降','橈動脈脈搏摸不到','意識改變'], tx:['依指引給予輸液或血液製品','分布性與心因性休克依指引使用升壓藥']},
    {t:'細胞缺氧與致死三角', d:'細胞改用無氧代謝，產生乳酸。酸中毒、低體溫與凝血病彼此加重，出血更止不住。',
     adv:'低體溫降低凝血酵素活性；大量冷輸液會同時造成稀釋與降溫。酸中毒也降低心肌對兒茶酚胺的反應。',
     signs:['皮膚花斑','體溫下降','傷口滲血不止'], tx:['保暖、避免不必要的暴露','避免大量冷輸液']},
    {t:'不可逆休克與心跳停止', d:'器官功能衰竭，最後以心搏過緩或 PEA 結束。創傷性心跳停止要優先處理可逆原因：出血、缺氧、張力性氣胸、心包填塞。',
     adv:'低血容造成的 PEA，單靠胸外按壓效果有限，關鍵是止血與恢復血容量，依指引處理。',
     signs:['心搏過緩','PEA'], tx:['依指引處理可逆原因']}
  ],

    {n:'平躺與保暖', at:[2,5], how:'平躺維持回心血量與腦灌流；保暖打斷致死三角中的低體溫。'},
    {n:'給氧', at:[1], how:'只在低血氧時提高血氧含量。它無法彌補失去的血紅素，所以不能取代止血。'},

    {n:'快速轉送確定性治療', at:[0,3], how:'內出血、心肌梗塞、肺栓塞都只能在醫院真正解決。'}

  why:[
    {q:'為什麼血壓是休克的晚期指標？', a:'身體會用心跳加快與血管收縮把血壓撐住。只有在這些代償用盡時，血壓才會下降。等血壓掉下來，病人已經失去了相當多的儲備。'},
    {q:'為什麼出血的創傷病人不要把血壓拉到正常？', a:'血壓過高可能把剛形成的血塊沖開。大量輸液也會稀釋凝血因子並降低體溫，讓出血更難止住。目標是足以維持重要器官的血壓，直到抵達能止血的地方。', adv:'頭部外傷合併出血時，大腦需要足夠的灌流壓，目標血壓較高，依所屬機關指引。'},
    {q:'為什麼要分辨是哪一種休克？', a:'處置方向可能相反。低血容休克需要補充容量；心因性休克大量輸液可能造成肺水腫；阻塞性休克要先解除阻塞（例如張力性氣胸減壓）；分布性休克要處理血管擴張的原因。'},
    {q:'微血管再充填時間可靠嗎？', a:'在兒童比較有參考價值。成人受到環境溫度、年齡與周邊血管疾病影響很大，冷天戶外幾乎都會延長。要和皮膚顏色、溫度、意識與脈搏一起判斷。'},
    {q:'SpO₂ 正常，為什麼病人仍然缺氧？', a:'SpO₂ 只告訴你血紅素上載了多少氧氣，不告訴你血紅素有多少、血流送得到哪裡。大量失血時，每個紅血球都滿載，但紅血球太少、血流太慢，細胞還是缺氧。'}

    {q:'一位 COPD 病人 SpO₂ 84%，你會怎麼給氧？給氧後怎麼確認安全？', guide:'引導學員說出目標範圍滴定、監測意識與 EtCO₂。常見誤解是「COPD 不能給氧」或「給到 100% 最安全」。可追問缺氧驅動理論為什麼被修正。', adv:true},
    {q:'哪些情況下 SpO₂ 會騙人？你在現場遇過嗎？', guide:'讓學員列出低灌流、低體溫、一氧化碳中毒、移動、指甲油或膚色影響。臨床教師可分享實例，強調儀器數字要和病人外觀一致。'}

    {q:'給氧中的病人 SpO₂ 95%，但 EtCO₂ 從 40 升到 65 mmHg，最可能代表？', opts:['氧合與通氣都很好','換氣過度','儀器故障，可忽略','通氣不足，CO₂ 滯留'], a:3, exp:'給氧可以維持 SpO₂，但無法排出 CO₂。'},
    {q:'一氧化碳中毒時，一般脈搏血氧計的讀數通常會？', opts:['假性正常或偏高','明顯偏低','完全讀不到','與動脈血氧一致'], a:0, exp:'一般血氧計無法區分一氧化碳血紅素與氧合血紅素。'},
    {q:'下列何者最符合呼吸肌疲乏？', opts:['呼吸速率 36，說話斷句','呼吸速率 16，說話完整','呼吸速率由快轉慢、變淺，意識下降','深而快的呼吸合併水果味'], a:2, exp:'疲乏的特徵是速率下降、意識變差，而病因並未改善。'},
    {q:'COPD 病人高濃度給氧後 CO₂ 上升，目前認為主要原因是？', opts:['缺氧驅動消失','V/Q 失衡惡化與 Haldane 效應','氧氣直接毒害呼吸中樞','CO₂ 產量增加'], a:1, exp:'缺氧驅動只佔很小部分，是需要修正的舊觀念。', adv:true},
    {q:'糖尿病酮酸中毒的深快呼吸，EtCO₂ 通常會？', opts:['偏高','偏低','正常','無法測量'], a:1, exp:'身體透過多呼吸排出 CO₂ 來代償代謝性酸中毒。'}
  ],
  assign:[
    {t:'氧氣目標範圍的證據整理', task:'查閱 TSANZ、BTS 或其他國際氧氣治療指引，以及至少一篇關於院前高氧與 COPD 死亡率的原始研究，整理不同族群的 SpO₂ 目標與證據。比較所屬機關的給氧規範。', deliver:'書面報告 1,000–1,500 字，附比較表與參考文獻', rubric:['正確引用指引與原始研究','清楚區分不同族群的目標','說明缺氧驅動迷思的修正','與台灣實務比較並提出建議']},
    {t:'EtCO₂ 波形判讀練習', task:'蒐集或繪製至少五種典型 EtCO₂ 波形（正常、阻塞、通氣過度、通氣不足、管路脫落或心跳停止中的變化），說明每種波形背後的生理機轉與院前處置意義。來源需為教科書或文獻。', deliver:'圖文教材 6–8 頁投影片', rubric:['波形描述正確','機轉解釋清楚','連結到具體處置決策','引用可靠來源']}
  ],

      {n:'以 BVM 配合病人呼吸輔助通氣', d:{EtCO2:-10,SpO2:+3}, fb:'作用在通氣與疲乏：排出 CO₂。當病人疲乏、EtCO₂ 上升時最需要。', ok:true},

/* ---------------------------------------------------------- 意識狀態評估 */
{
  id:'conscious', zh:'意識狀態評估', en:'Conscious State Assessment', sec:'評估',
  core:'意識是大腦灌流與代謝的總結果。意識改變先找能立刻矯正的：缺氧、低血糖、低灌流。',
  chain:[
    {t:'起因：結構性或代謝性', d:'結構性：腦裡有東西佔位或出血（中風、頭部外傷、腫瘤）。代謝性或毒物性：大腦本身沒有結構問題，但環境出錯（低血糖、缺氧、藥物、感染、體溫）。',
     adv:'AEIOU-TIPS 是常用的鑑別框架：酒精與酸中毒、癲癇與電解質與內分泌、胰島素相關（低／高血糖）、鴉片類與缺氧與過量、尿毒症；創傷與體溫、感染、精神與中毒、中風與休克與佔位病灶。局部神經學徵象（單側無力、瞳孔不等大）較傾向結構性。',
     signs:['現場藥物、酒瓶、注射器','外傷痕跡','發燒、頸部僵硬','單側無力、口齒不清'], tx:['蒐集現場線索與病史','測血糖、體溫']},
    {t:'大腦供需失衡', d:'大腦耗氧量很高，卻幾乎沒有能量儲存。只要氧氣、葡萄糖或血流中斷幾秒到幾分鐘，功能就會受影響。',
     adv:'腦灌流壓（CPP）= 平均動脈壓 − 顱內壓。正常情況下腦血流有自動調節，但在創傷、中風或嚴重高血壓時，自動調節受損，腦血流直接跟著血壓走。',
     signs:['SpO₂ 下降','血糖異常','低血壓'], tx:['給氧','依指引矯正低血糖','維持灌流']},
    {t:'意識系統受損：意識下降', d:'清醒需要腦幹的網狀活化系統與雙側大腦皮質。單側小範圍的皮質損傷通常不會造成昏迷；昏迷代表腦幹受影響或兩側大腦廣泛受影響。',
     adv:'GCS 分三部分：睜眼（E）、語言（V）、運動（M）。運動分數對預後最有預測力，也最不受插管或語言障礙干擾。報告時要寫各分項（例如 E2V3M5），不只寫總分。',
     signs:['GCS 或 AVPU 下降','混亂、躁動','對疼痛刺激只能定位或屈曲'], tx:['記錄 E/V/M 各分項','建立基準以便比較趨勢']},
    {t:'保護反射喪失 → 二次腦傷', d:'意識下降後舌頭後倒、咳嗽與吞嚥反射變差，容易氣道阻塞與吸入。缺氧與 CO₂ 上升又讓大腦更腫，形成惡性循環。',
     adv:'頭部外傷研究顯示，即使只有一次低血氧或低血壓，死亡率也明顯上升。院前最重要的工作就是避免二次腦傷：缺氧、低血壓、高或低 CO₂、低血糖、高體溫。',
     signs:['打鼾聲、咕嚕聲','嘔吐','SpO₂ 下降','EtCO₂ 上升'], tx:['開放氣道、抽吸','復甦姿勢','給氧與輔助通氣']},
    {t:'顱內壓上升', d:'顱骨是一個固定的盒子，裡面有腦組織、血液與腦脊髓液。出血或腫脹讓壓力上升，一開始可以把腦脊髓液和靜脈血擠出去代償，代償用完壓力就急速上升。',
     adv:'這是 Monro-Kellie 原理。顱內壓上升會壓低腦灌流壓；CO₂ 上升使腦血管擴張，進一步增加顱內體積。老人腦萎縮，顱內空間較大，出血可以累積很多才出現症狀。',
     signs:['頭痛、嘔吐','意識持續下降','躁動'], tx:['避免缺氧與 CO₂ 上升','維持血壓','依指引抬高頭部']},
    {t:'腦疝', d:'壓力把腦組織從一個腔室擠到另一個腔室，壓迫腦幹。這是神經外科急症，院前只能爭取時間。',
     adv:'鉤迴疝壓迫動眼神經，造成同側瞳孔放大；壓迫運動傳導路徑造成對側無力（少數為同側）。Cushing 反應：高血壓、心搏過緩、呼吸不規則，代表腦幹受壓。出現腦疝徵象時，是否短暫過度換氣依所屬機關指引，且不可常規使用。',
     signs:['單側瞳孔放大、對光反射消失','伸張姿勢','高血壓合併心搏過緩','呼吸不規則'], tx:['預警並直送有神經外科的醫院','依指引調整通氣目標']},
    {t:'腦幹衰竭與死亡', d:'呼吸中樞與心血管中樞受壓，呼吸停止，接著心跳停止。',
     adv:'腦幹衰竭可造成先高後低的血壓變化與心律不整。此時即使恢復循環，神經學預後也很差。',
     signs:['呼吸停止','雙側瞳孔放大固定','心律不整'], tx:['依指引進行復甦']}
  ],
  drugs:[
    {n:'氣道管理與姿勢', at:[3], how:'壓額抬下巴、抽吸、口咽或鼻咽呼吸道、復甦姿勢，維持氣道暢通並降低吸入。'},
    {n:'給氧與輔助通氣', at:[1,3,4], how:'避免缺氧與 CO₂ 上升。CO₂ 過高使腦血管擴張，過低使腦血管收縮導致缺血。'},
    {n:'血糖檢測與矯正', at:[0,1], how:'低血糖是最常見、最能立即逆轉的意識改變原因之一。依指引給予葡萄糖或升糖素。'},
    {n:'維持灌流', at:[1,4], how:'低血壓會直接降低腦灌流壓，頭部外傷病人尤其要避免。依指引給予輸液。'},
    {n:'Naloxone', at:[0,3], how:'鴉片受體拮抗劑，逆轉鴉片類造成的呼吸抑制。目標是恢復足夠的呼吸，不是讓病人完全清醒。', adv:true},
    {n:'頭部抬高', at:[4], how:'在無低血壓且已做好脊椎保護時，抬高頭部促進靜脈回流，降低顱內壓。依指引執行。', adv:true}
  ],
  why:[
    {q:'為什麼每個意識改變的病人都要測血糖？', a:'低血糖可以模仿幾乎任何神經學表現，包括中風樣的單側無力、躁動與癲癇。它容易測、容易矯正，錯過卻可能造成永久腦傷。'},
    {q:'為什麼報告 GCS 要拆成 E、V、M？', a:'同樣是 GCS 9，E2V2M5 和 E3V4M2 的意義差很多。運動分數最能預測預後；語言分數受插管、失語或語言隔閡影響。各分項的變化也比總分更早反映惡化。'},
    {q:'頭部外傷為什麼特別強調避免低血壓與缺氧？', a:'受傷的大腦失去自動調節，血壓一低、氧氣一少，腦細胞就會再受傷（二次腦傷）。第一次撞擊造成的傷害院前無法逆轉，但二次腦傷是可以預防的。'},
    {q:'為什麼不常規讓頭部外傷病人過度換氣？', a:'CO₂ 太低會讓腦血管收縮，雖然顱內壓暫時下降，但腦血流也減少，可能造成缺血。只有在出現腦疝徵象時，依指引短暫使用。', adv:'通氣目標以 EtCO₂ 引導，維持在正常低值範圍，依所屬機關指引。'},
    {q:'「GCS 8 以下就要插管」這句話對嗎？', a:'這是過度簡化的口訣。關鍵是病人能不能維持氣道、保護氣道並有足夠通氣。有些 GCS 偏低的病人（如酒精中毒、癲癇後）用基本氣道處置就足夠；有些 GCS 較高的病人（如臉部燒傷、氣道腫脹）卻很早就需要進階氣道。'}
  ],

     adv:'疼痛評估工具：成人用數字量表（0–10）；幼兒用臉譜量表；無法表達者（嬰幼兒、失智、意識改變）用行為量表，如 FLACC 或 PAINAD。表情平靜不代表不痛。',

/* ---------------------------------------------------------- 創傷分級 */
{
  id:'trauma-triage', zh:'創傷分級', en:'Trauma Triage', sec:'評估',
  core:'創傷分級是在預測看不見的傷：能量越大、儲備越少，越要送到能立即手術的地方。',
  chain:[
    {t:'受傷機轉', d:'車禍、墜落、穿刺傷、被撞擊。機轉告訴你有多少能量進入身體，以及從哪個方向進來。',
     adv:'動能與質量成正比、與速度平方成正比：速度加倍，能量變成四倍。鈍傷的能量分散，穿刺傷的能量集中在路徑上。車輛嚴重變形、被拋出車外、同車有人死亡、行人或機車騎士被撞，都是高能量的線索。',
     signs:['車輛變形、方向盤或擋風玻璃破損','墜落高度、著地部位','武器類型'], tx:['觀察並記錄現場','向醫院描述機轉']},
    {t:'能量轉移到組織', d:'能量在體內造成壓縮、剪力與加速減速傷。器官被固定的地方最容易撕裂。',
     adv:'加速減速傷：主動脈在峽部（固定點）撕裂；腎臟、脾臟、腸繫膜在血管根部撕裂；大腦在顱內前後撞擊，造成對衝傷與瀰漫性軸突損傷。安全帶痕跡提示腹腔內與腰椎損傷。',
     signs:['安全帶痕跡','胸腹部挫傷','頭部撞擊痕跡'], tx:['從頭到腳檢查','評估脊椎損傷風險']},
    {t:'隱藏性傷害', d:'最致命的出血常常看不到：胸腔、腹腔、骨盆、長骨骨折周圍與後腹腔。外觀輕微不代表內部輕微。',
     adv:'「地上一處，體內四處」：外出血加上胸、腹、骨盆、長骨。骨盆骨折可造成大量後腹腔出血，不要用按壓或搖動骨盆的方式檢查穩定度，懷疑時直接使用骨盆帶。',
     signs:['腹脹、壓痛','骨盆疼痛、雙腿長度不等','大腿腫脹變形','呼吸音減弱'], tx:['骨盆帶','固定長骨','控制出血']},
    {t:'生理代償遮蔽嚴重度', d:'年輕人可以在大量內出血的情況下維持正常血壓。生命徵象正常不代表傷勢輕。',
     adv:'生理準則（意識、呼吸、血壓）異常代表已經失代償，特異性最高，最能預測需要創傷中心；解剖準則次之；機轉準則敏感但特異性較低。2021 年美國現場創傷分級指引把「無法遵從指令」（運動分數小於 6）列為生理準則之一。',
     signs:['心搏過速、呼吸加快','皮膚濕冷','焦躁不安'], tx:['重複評估趨勢','以機轉與解剖補足生理的盲點']},
    {t:'低儲備：老年與抗凝血', d:'老人骨質疏鬆、血管脆弱、代償差，低能量的跌倒也可能造成嚴重傷害。抗凝血或抗血小板藥物讓出血更難停止。',
     adv:'老人腦萎縮使橋靜脈被拉長，輕微撞擊就可能造成硬腦膜下出血，且顱內空間大，症狀可能延遲出現。β 阻斷劑遮蔽心搏過速；平常高血壓者的「正常」血壓可能已是休克。許多分級準則對老人採用較高的血壓警戒值。',
     signs:['年齡','用藥：warfarin、DOAC、抗血小板','低能量跌倒但撞擊頭部'], tx:['降低分級門檻','詢問用藥並告知醫院']},
    {t:'時間依賴性死亡', d:'創傷可預防的死亡，多數來自未控制的出血與氣道問題。從受傷到確定性止血的時間，直接影響存活。',
     adv:'分級的目標是把「需要創傷中心的人」送到創傷中心。國際上常以低估分級（undertriage）不超過約 5% 為目標，並接受較高比例的過度分級，因為低估的代價是死亡。台灣以「醫院緊急醫療能力分級」區分重度、中度、一般級急救責任醫院。',
     signs:['生命徵象惡化','意識下降'], tx:['縮短現場時間','預警並直送重度級醫院或創傷中心']}
  ],
  drugs:[

    {n:'解剖準則', at:[2], how:'穿刺傷、連枷胸、骨盆骨折、兩處以上長骨骨折、截肢等，代表已知的嚴重傷害。'},

    {n:'特殊族群考量', at:[4], how:'老人、抗凝血藥、懷孕、兒童：儲備或生理不同，降低轉送高級別醫院的門檻。'},
    {n:'骨盆帶與止血', at:[2,5], how:'在送達前減少可控制的出血。'},
    {n:'預警與直送', at:[5], how:'跳過無法處理的醫院，讓手術室與輸血提前準備，縮短到確定性止血的時間。'}
  ],
  why:[
    {q:'為什麼生理準則排在最前面？', a:'生理異常表示身體的代償已經不夠，這些病人最可能需要立即手術或輸血。它的預測力最強，也最不會誤判。'},
    {q:'高能量機轉但生命徵象正常，為什麼仍要考慮送創傷中心？', a:'代償會遮蔽嚴重度，尤其是年輕人。主動脈、脾臟、骨盆的損傷可能在送錯醫院後才失代償，到時再轉院就太晚了。機轉準則的價值就是補生理準則的盲點。'},
    {q:'老人在家跌倒，為什麼也可能要送高級別醫院？', a:'老人的組織與血管脆弱，低能量就能造成骨折與顱內出血，而且代償差、用藥多，生命徵象容易騙人。研究顯示老人創傷常被低估分級。'},
    {q:'服用抗凝血藥的人撞到頭但意識清楚，為什麼要警覺？', a:'抗凝血藥讓顱內出血較容易發生且較難止住。病人一開始可能完全清醒，數小時內才惡化。多數國際指引建議這類病人到醫院接受電腦斷層評估。', adv:'需要詢問藥名與最後服藥時間，醫院可能需要使用逆轉劑。DOAC 與 warfarin 的逆轉方式不同。'},
    {q:'為什麼過度分級可以接受，低估分級不行？', a:'把傷勢較輕的人送到創傷中心，代價是資源使用；把需要手術的人送到無法處理的醫院，代價可能是生命。分級系統刻意偏向安全的一邊。'}

     adv:'低血容的 PEA 常見窄 QRS、頻率快；超音波可能看到心臟仍在動但充填極差（pseudo-PEA）。回補容積以血品優先（依所屬系統），大量晶體液會稀釋凝血因子、降低體溫並加重酸中毒。',

    {t:'心包填塞：心臟撐不開', d:'心包膜內積血，心臟被包住無法充填。胸前、胸骨旁或上腹部的穿刺傷要特別想到。',
     adv:'院前多數系統無法處理心包填塞，關鍵是早期辨識、快速送往能開胸的醫院並預警。部分系統由醫師團隊執行院前開胸（resuscitative thoracotomy）。穿刺傷且剛失去生命跡象的病人最可能受益。',
     signs:['胸前或上腹部穿刺傷','窄 QRS 的 PEA','頸靜脈怒張（不一定出現）'], tx:['立即轉送並預警','依系統進階處置']},
    {t:'缺氧：呼吸道與通氣失敗', d:'頭部外傷、顏面損傷、呼吸道阻塞或胸壁損傷造成缺氧，心跳因缺氧逐漸變慢到停止。這類病人打開呼吸道並給氧通氣，就可能恢復。',
     adv:'嚴重頭部撞擊當下可能出現短暫呼吸停止（impact brain apnoea）。這時若有人立即提供通氣支持，可能避免後續的缺氧性心跳停止。',
     signs:['呼吸道阻塞、顏面嚴重損傷','頭部外傷','心搏過緩之後停止'], tx:['打開呼吸道、抽吸','給氧通氣','進階氣道（依層級）']},

     adv:'低血容時壓胸對血流的貢獻很小。Adrenaline 在低血容的創傷性心跳停止角色有限，優先順序排在處理可逆原因之後（依指引）。',

     adv:'長時間無生命跡象、心搏停止，或損傷明顯與生命不相容時，依所屬機關指引判斷不予或終止復甦。',

{
  id:'newborn', zh:'新生兒復甦', en:'Newborn Resuscitation', sec:'心跳停止與復甦',
  core:'新生兒很少是「心臟先停」，而是肺沒有打開、缺氧讓心跳變慢。讓肺充氣，心率就會回來。',
  chain:[
    {t:'胎兒循環：肺還沒上工', d:'胎兒的肺充滿液體，不負責換氣，氧氣來自胎盤。肺血管阻力很高，血液經卵圓孔與動脈導管繞過肺。',
     adv:'胎兒血紅素與氧的親和力高，讓胎兒在相對低氧的環境中仍能運作。這也是剛出生時 SpO₂ 偏低、要數分鐘才上升的原因。',
     signs:['懷孕週數','產程是否延長或異常','羊水性狀（清澈或含胎便）'], tx:['預先準備保暖與通氣設備','分配媽媽與寶寶的照顧者']},
    {t:'出生時的循環轉換', d:'第一口哭吸撐開肺泡、把肺液推出去。肺泡充氣與氧氣上升讓肺血管放鬆，肺血流大增；左心房壓上升關閉卵圓孔，動脈導管開始收縮。',
     adv:'肺部充氣本身是降低肺血管阻力的主要觸發。臍帶夾閉移除低阻力的胎盤，體循環阻力上升。有活力的新生兒依指引延遲夾臍，讓肺血流先建立，血流動力學轉換較平穩。',
     signs:['哭聲有力','規則呼吸','膚色在數分鐘內由紫轉紅'], tx:['擦乾、刺激','延遲夾臍（依指引）']},
    {t:'轉換失敗：肺沒有打開', d:'產程中缺氧、早產、母親用藥或感染，可能讓新生兒沒有有效呼吸。肺液沒排出，肺血管持續收縮，血液繼續繞過肺。',
     adv:'原發性呼吸暫停對刺激可能有反應；繼發性呼吸暫停不會自行恢復，需要正壓通氣。兩者臨床上無法區分，所以擦乾刺激後仍沒有有效呼吸，就要開始通氣，不要一直刺激。',
     signs:['無呼吸或只有喘息','肌肉張力低、軟趴趴','膚色蒼白或發紺'], tx:['擦乾刺激','頭部中立位打開呼吸道']},
    {t:'缺氧 → 心搏過緩', d:'新生兒心肌對缺氧的反應是心跳變慢。心率是反映缺氧最敏感的指標，也是判斷通氣有沒有效的最佳指標。',
     adv:'心率以聽診或 ECG 評估比摸臍帶準確；ECG 判讀快速可靠。心率低於 100 次/分要開始正壓通氣；有效通氣 30 秒後心率仍低於 60 次/分才開始壓胸（依指引）。',
     signs:['心率低於 100 次/分','發紺、張力低'], tx:['正壓通氣','持續監測心率']},
    {t:'正壓通氣：復甦的核心', d:'用面罩給予正壓通氣，把肺液推出，讓肺泡充氣。看到胸廓起伏、心率上升，就表示通氣有效。',
     adv:'部分指引建議起始幾次通氣的吸氣時間稍長，以克服肺液阻力；常規使用長時間持續充氣（sustained inflation）目前不建議，依所屬機關指引。通氣無效時依序矯正：面罩密合、頭位、抽吸口鼻、張口、提高壓力、考慮替代呼吸道。足月兒從空氣開始，依導管前（右手）SpO₂ 逐步調整氧濃度。',
     signs:['胸廓起伏','心率上升'], tx:['面罩正壓通氣','通氣矯正步驟']},
    {t:'失溫：轉換的隱形殺手', d:'新生兒體表面積相對大、皮膚濕、皮下脂肪少，出生幾分鐘內體溫就會快速下降。失溫增加耗氧、造成低血糖與酸中毒，也讓肺血管再度收縮。',
     adv:'新生兒主要靠棕色脂肪產熱（非顫抖性產熱），需要氧氣與葡萄糖，缺氧時產熱能力下降。目標體溫 36.5–37.5 °C；早產兒可直接用塑膠袋包覆身體。也要避免過熱。',
     signs:['皮膚冰冷','體溫低於 36.5 °C'], tx:['擦乾並換乾毛巾','戴帽子','肌膚接觸','救護車艙內加溫']},
    {t:'循環衰竭', d:'缺氧持續，心肌能量耗盡，心率掉到極慢甚至停止。這時才需要壓胸與藥物；但通氣沒做好，壓胸也沒有用。',
     adv:'壓胸與通氣的比例、adrenaline 的途徑（臍靜脈或骨內）依指引。疑似失血（胎盤早期剝離、臍帶出血）時考慮擴容。',
     signs:['心率低於 60 次/分','摸不到或聽不到心跳'], tx:['壓胸配合通氣','Adrenaline（依指引）','擴容（依指引）']}
  ],

    {n:'正壓通氣', at:[2,3,4], how:'讓肺充氣、排出肺液，降低肺血管阻力，矯正缺氧，心率隨之上升。'},

    {n:'延遲夾臍', at:[1], how:'讓肺血流先建立再移除胎盤血流，轉換較平穩（適用有活力的新生兒，依指引）。'},

  why:[
    {q:'為什麼新生兒復甦的重點是通氣，不是壓胸？', a:'新生兒心跳變慢幾乎都是因為缺氧，源頭是肺沒有打開。肺充氣後氧氣進來，心率通常就會回升。通氣沒做好就急著壓胸，等於沒有處理原因。'},
    {q:'為什麼心率是最重要的評估指標？', a:'新生兒心肌對缺氧非常敏感，缺氧時心跳變慢，矯正後心跳上升。心率能即時告訴你通氣有沒有效。膚色變化慢又主觀，不可靠。'},
    {q:'為什麼足月兒不一開始就給高濃度氧氣？', a:'剛出生的 SpO₂ 本來就偏低，需要數分鐘才上升。過多氧氣會產生自由基，研究顯示足月兒以空氣開始復甦的死亡率較低。依導管前 SpO₂ 逐步調整。', adv:'早產兒的起始氧濃度與目標 SpO₂ 依所屬機關指引。'},
    {q:'為什麼保暖跟通氣一樣重要？', a:'新生兒散熱非常快。失溫讓耗氧增加、血糖下降、出現酸中毒，肺血管也會再度收縮，讓循環轉換失敗。失溫的新生兒更難復甦。'},
    {q:'羊水含胎便，是不是要先抽吸氣管？', a:'有活力的新生兒不需要。沒有活力時，目前指引不建議常規氣管內抽吸，因為會延誤通氣；只有在呼吸道被阻塞時才抽吸。通氣仍是第一優先，依所屬機關指引。'}

    {q:'胸痛病人為什麼不常規給氧？', a:'舊觀念認為多給氧可以救心肌。研究顯示血氧正常的病人給氧沒有好處，高氧可能讓冠狀動脈收縮、增加自由基，梗塞面積甚至可能更大。所以只在 SpO₂ 偏低時給，目標依指引。', adv:'AVOID（2015）與 DETO2X-AMI（2017）等試驗是指引改變的主要證據；ANZCOR、ESC 等皆建議僅在低血氧時給氧。'},
    {q:'心電圖沒有 ST 上升，可以放心嗎？', a:'不行。NSTEACS 的心電圖可能完全正常，但一樣會惡化、一樣可能致命。心電圖只是一個時間點的照片，症狀改變時要重做。院前判斷要看病史、危險因子與症狀型態。'},
    {q:'為什麼要繞過最近的醫院，直送可做 PCI 的醫院？', a:'STEMI 的根本治療是打通血管。先到沒有導管室的醫院再轉院，常多花一小時以上，這段時間心肌持續壞死。院前傳送心電圖並預警，導管室可以在病人抵達前就準備好。', adv:'轉送時間很長時，溶栓仍是選項。台灣依各縣市救護指引與急救責任醫院的心導管能力決定後送。'}

{

  chain:[

     adv:'兒童心搏過緩最常見的原因是缺氧，先處理呼吸道與通氣。下壁心肌梗塞時，右冠狀動脈常供應竇房結與 AV 結。顱內壓上升的 Cushing 反應（高血壓、心搏過緩、呼吸不規則）是腦疝的警訊，不是心臟問題。',
     signs:['用藥史：降壓藥、心律藥','腎臟病、洗腎病人漏洗','寒冷環境、頭部外傷','胸痛'], tx:['詢問用藥與病史','測血糖與體溫','優先處理缺氧']},
    {t:'竇房結問題或房室傳導阻斷', d:'竇房結發電變慢或暫停，是「發電廠」的問題。房室傳導阻斷（AV block）是「電線」的問題：心房有發電，但訊號傳不到心室。',

     signs:['脈搏慢，規則或不規則','心電監視上 P 波與 QRS 的關係（概念：每個 P 波後面是否都跟著 QRS）'], tx:['12 導程心電圖','持續監視']},
    {t:'每搏量代償到極限', d:'心跳變慢時，舒張期延長，心室填充更多，每搏量可以增加一些。但代償有上限，超過之後，心輸出量就開始下降。',
     adv:'運動員靜息心跳 40 多次仍有足夠的每搏量；收縮功能差或心室僵硬的老人，心跳 50 就可能失代償。病人的生理餘裕比數字重要。',
     signs:['心跳慢但意識清楚、血壓正常（可能無症狀）'], tx:['無症狀者監測、找原因、送醫評估']},
    {t:'灌流不足：症狀性心搏過緩', d:'心輸出量不足時，腦、心臟與全身的灌流下降。判斷「症狀性」看的是灌流不足的證據，不是心跳數字。',
     adv:'不穩定的徵象：低血壓、意識改變或暈厥、缺血性胸痛、急性心衰竭（肺水腫）、休克徵象。出現任一項就要積極處置。',

    {t:'逸脫節律衰竭 → 心跳停止', d:'完全阻斷時，心室靠下游的逸脫節律撐著。越下游越慢、越不可靠，最後可能心室停止或變成 PEA。',
     adv:'高血鉀時 QRS 逐漸變寬、P 波消失，最後形成正弦波樣節律並停止。鈣劑穩定心肌細胞膜，作用快但短；之後要讓鉀進入細胞並移除鉀，院前做法依指引。',
     signs:['寬 QRS 的慢節律（概念）','意識喪失','無脈搏'], tx:['CPR','高血鉀時考慮鈣劑（依指引）']}

  why:[
    {q:'心跳 45 次，病人意識清楚、血壓正常，需要給藥嗎？', a:'不一定。治療的對象是灌流不足，不是數字。無症狀的心搏過緩重點是監測、找原因並送醫評估。運動員或服用 β 阻斷劑的人心跳偏慢可能是常態。但 Mobitz II 或完全阻斷即使暫時穩定，也可能突然惡化，要做好準備。'},
    {q:'為什麼 atropine 有時沒有用？', a:'Atropine 的作用是拿掉迷走神經的煞車。如果問題在 AV 結以下（寬 QRS 的完全阻斷、Mobitz II），那裡幾乎沒有迷走神經支配，拿掉煞車沒有意義。心臟移植病人的心臟沒有迷走神經連接，atropine 也無效。', adv:'這時應直接使用經皮節律器或 adrenaline 輸注，不要反覆給 atropine 浪費時間。急性心肌梗塞時心跳上升也會增加耗氧，依指引謹慎使用。'},
    {q:'經皮節律器開了，螢幕上每次刺激後都有波形，為什麼還要摸脈搏？', a:'螢幕上的電氣捕獲（每個刺激後跟著寬 QRS）不等於心臟真的收縮了。要摸股動脈脈搏，或看血壓、SpO₂ 波形來確認機械捕獲。頸動脈與橈動脈容易被節律器引起的肌肉抽動干擾。', adv:'節律器很痛，清醒病人需要鎮靜與止痛，依指引。'},
    {q:'洗腎病人心跳慢、QRS 變寬，為什麼要想到高血鉀？', a:'鉀離子濃度決定心肌細胞的靜止膜電位。高血鉀讓細胞部分去極化，傳導變慢、QRS 變寬，最後可能心跳停止。漏洗、腎功能惡化、某些降壓藥都會增加風險。', adv:'鈣劑穩定細胞膜而不降鉀；salbutamol 與胰島素讓鉀進入細胞；最終需要透析移除。高血鉀引起的心搏過緩對 atropine 與節律器的反應常不佳。'},
    {q:'β 阻斷劑或鈣離子阻斷劑過量造成的心搏過緩，處理有什麼不同？', a:'藥物直接佔住心臟的受體或離子通道，atropine 效果常有限，血管擴張也讓血壓更低。要儘早取得用藥資訊、聯絡毒物諮詢中心，並送往有能力處理的醫院。', adv:'院內可能使用高劑量胰島素、鈣劑、升糖素等治療；院前做法依所屬機關指引。'}

{
  id:'vt', zh:'心室性心搏過速', en:'Ventricular Tachycardia', sec:'心臟系統',
  core:'心室自己繞圈放電，跳太快讓心室來不及填滿；灌流穩不穩，決定用藥還是電擊。',
  chain:[
    {t:'基質：疤痕、缺血、電解質', d:'舊心肌梗塞的疤痕、心肌病變、急性缺血、電解質異常（低鉀、低鎂、高鉀）與某些藥物，讓心室肌的電性變得不均勻。',
     adv:'單形性 VT 多來自疤痕周圍的折返。多形性 VT 常見於急性缺血。QT 延長（藥物、低鉀、低鎂、先天）造成的多形性 VT 稱為 torsades de pointes，機轉與處置不同。',
     signs:['心肌梗塞或心衰病史','植入式去顫器（ICD）','服用利尿劑、抗心律不整藥或延長 QT 的藥物'], tx:['詢問病史與 ICD','12 導程記錄發作時節律']},
    {t:'折返迴路', d:'疤痕中有傳導很慢的通道。電訊號繞過疤痕一圈回到起點時，原本的組織已經恢復，可以再被激發，於是形成不停繞圈的迴路。每繞一圈，心室就收縮一次。',
     adv:'折返成立需要三個條件：兩條傳導路徑、其中一條單向阻斷、傳導夠慢讓起點有時間脫離不反應期。打斷折返的策略：延長不反應期（例如 amiodarone），或用電擊讓整個迴路同時去極化。',
     signs:['寬 QRS、規則、快速（概念）','突然開始'], tx:['同步電擊','Amiodarone（依指引）']},
    {t:'舒張期縮短 → 填充不足', d:'心跳變快時，縮短的主要是舒張期。心室來不及填滿，每搏量下降。VT 還讓心房與心室失去協調，收縮順序也不正常。',
     adv:'收縮期長度相對固定，舒張期隨心跳上升急遽縮短。CO = HR × SV：心跳上升到某個程度後，SV 下降的速度超過 HR 上升，心輸出量反而下降。心室由異常位置啟動，收縮不協調，效率更差。',
     signs:['脈搏快而弱','血壓下降','頭暈、心悸'], tx:['評估穩定度']},
    {t:'冠狀灌流下降，耗氧上升', d:'左心室的冠狀動脈血流主要在舒張期。舒張期縮短加上血壓下降，心肌供氧變少；同時高心跳讓耗氧大增。缺血又讓電性更不穩定。',

{
  id:'af', zh:'心房顫動', en:'Atrial Fibrillation', sec:'心臟系統',

  chain:[
    {t:'心房基質與誘因', d:'年紀、高血壓、心衰、瓣膜病、肥胖、睡眠呼吸中止讓心房擴大與纖維化。酒精、感染、甲狀腺亢進、手術、脫水等可以觸發發作。',
     adv:'多數陣發性 AF 由肺靜脈周圍的異位放電觸發，纖維化的心房維持許多小折返波。陣發性、持續性、永久性的分類影響長期治療方向。',
     signs:['高齡、高血壓、心衰病史','服用抗凝血劑（DOAC 或 warfarin）或心律藥'], tx:['詢問用藥與 AF 病史']},
    {t:'心房電氣混亂，失去心房收縮', d:'心房以每分鐘數百次的速度亂顫，沒有有效收縮。心室填充少了最後那一下「心房推一把」（atrial kick）。',
     adv:'心房收縮在一般人約占左心室填充的 15–30%；心室僵硬的病人（老人、左心室肥厚、主動脈瓣狹窄、舒張性心衰）更依賴它，失去後影響更大。',
     signs:['心電監視：沒有 P 波、基線顫動（概念）'], tx:['評估心室率與灌流']},
    {t:'AV 結決定心室反應率', d:'AV 結像閘門，只放部分訊號通過，所以脈搏「完全不規則」。放行多少決定心室跳多快：太快（快速心室反應）、剛好或太慢。',
     adv:'交感張力、發燒、低血容讓 AV 結傳導加快；β 阻斷劑、鈣離子阻斷劑、digoxin 讓它變慢。心室率快而不規則時，舒張期長短不一，太短的那幾下幾乎打不出血，形成脈搏短絀（心尖或心電圖心跳數多於橈動脈脈搏數）。',
     signs:['完全不規則的脈搏','脈搏短絀','心悸、疲倦、喘'], tx:['用監視器或心尖聽診計數心率']},
    {t:'是原因，還是結果？', d:'敗血症、脫水、出血、缺氧、疼痛時，身體靠心跳加快代償；原本有 AF 的人就表現成快速 AF。這時快速心率是結果，硬把它壓低反而讓心輸出量崩盤。',
     adv:'線索：發燒、感染源、腹瀉嘔吐、低血容徵象、出血、急性呼吸疾病。處理原因（給氧、輸液、止痛、治療感染）後心率常會自然下降。原發性快速 AF 通常沒有其他明顯誘因，症狀與心率直接相關。',
     signs:['發燒、感染徵象','脫水、出血','低血氧'], tx:['處理原因：給氧、輸液、止痛','預警敗血症']},

     adv:'長期未控制的快速心率可造成心搏過速性心肌病變。快速 AF 合併肺水腫時，速率控制與降負荷的平衡依指引。',
     signs:['低血壓','胸痛','濕囉音、端坐呼吸'], tx:['不穩定時考慮電擊（依指引）','速率控制（依指引）']},

{

    {q:'為什麼懷疑時就該給 hydrocortisone，不必等抽血確認？', a:'確診要靠實驗室數據，院前做不到。對有風險的病人，給一次 hydrocortisone 的風險很低；延遲給藥的代價可能是死亡。所以國際共識是：懷疑就給，再送醫確認。', adv:'劑量與途徑（IM/IV）依所屬機關指引。病人自備的藥物可以使用，依指引確認。'},
    {q:'為什麼要問病人最近有沒有停類固醇？', a:'長期使用後突然停藥，自己的腎上腺還沒恢復，等於沒有皮質醇來源。即使停藥數週到數月，遇到壓力仍可能發生危象。'},
    {q:'原發性和長期類固醇造成的，表現為什麼會不同？', a:'原發性是腎上腺壞掉，皮質醇與醛固酮都缺，所以高血鉀、低血鈉較明顯，皮膚可能變黑。類固醇抑制的是腦下垂體那一層，醛固酮通常還在，高血鉀較少見，但低血壓與低血糖一樣危險。'}

/* ---------------------------------------------------------- 高血鉀 */
{
  id:'hyperk', zh:'高血鉀', en:'Hyperkalaemia', sec:'內科急症',
  core:'鉀決定心肌細胞的靜止電位。鈣先護住心臟，胰島素與 β2 把鉀趕回細胞，真正排鉀要靠醫院。',
  chain:[
    {t:'鉀進得多或排不掉', d:'最常見是腎臟排不掉：腎衰竭、漏洗腎。其次是藥物（ACE 抑制劑、ARB、保鉀利尿劑）與細胞破裂大量釋出鉀（擠壓傷、橫紋肌溶解、溶血）。',
     adv:'酸中毒（如 DKA）讓氫離子進細胞、鉀跑出來；腎上腺功能不全缺醛固酮；succinylcholine 與 digoxin 中毒也會造成高血鉀。擠壓傷在解除壓迫、血流恢復時，鉀會突然大量進入循環。',
     signs:['洗腎病人、動靜脈瘻管','最近漏洗','長時間受困或壓迫','多種心臟腎臟用藥'], tx:['詢問透析排程與最近一次洗腎','受困病人解除壓迫前依指引準備']},
    {t:'細胞外鉀上升 → 靜止膜電位變淺', d:'細胞內鉀多、細胞外鉀少，這個濃度差讓細胞維持負的靜止電位。細胞外鉀上升，差距縮小，電位變得比較不負（往 0 靠近）。',
     adv:'靜止膜電位主要由鉀的 Nernst 平衡電位決定。電位變淺一開始讓細胞更接近閾值（更易興奮），但持續去極化會讓快速鈉通道失活，反而變得難以興奮。',
     signs:['肌肉無力、麻木','心悸','多數病人無特異症狀'], tx:['12 導程心電圖','持續心律監測']},
    {t:'復極加速 → T 波高尖', d:'細胞外鉀高時，鉀通道導通增加，心肌復極變快變陡，心電圖上 T 波變得又高又尖、底部窄。',
     adv:'IKr 等鉀電流對細胞外鉀敏感，濃度上升時電流增加，復極期縮短。T 波高尖在胸導程最明顯，但與血鉀數值相關性不佳。',
     signs:['T 波高尖、對稱、底部窄'], tx:['鈣劑（依指引）']},
    {t:'鈉通道失活 → 傳導變慢', d:'膜電位持續變淺，負責快速去極化的鈉通道打不開，電訊號傳得慢。先影響心房（P 波變平、消失），再影響傳導系統（PR 延長）與心室（QRS 變寬）。',
     adv:'心房肌對高血鉀較敏感，所以 P 波常先消失；竇房結仍可經由結間路徑傳導（sinoventricular rhythm）。也可能出現各種房室傳導阻滯與心搏過緩。',
     signs:['P 波變平或消失','PR 延長','QRS 變寬','心搏過緩、傳導阻滯'], tx:['鈣劑','Salbutamol','胰島素加葡萄糖（醫院）']},
    {t:'正弦波 → 心室顫動或心搏停止', d:'QRS 越來越寬，最後與 T 波融合成正弦波，接著轉為心室顫動、PEA 或心搏停止。這個進程可能非常快，不一定按順序。',
     adv:'心電圖可能從看似正常直接跳到致死心律。高血鉀的心跳停止要在急救中處理可逆原因（4H4T 中的 hyperkalaemia），並依指引給予鈣劑與碳酸氫鈉。',
     signs:['正弦波','寬 QRS 心搏過緩','VF、PEA、心搏停止'], tx:['高品質 CPR','鈣劑與碳酸氫鈉（依指引）','預警可透析的醫院']}

    {n:'Salbutamol', at:[1,3], how:'β2 受體活化 Na⁺/K⁺-ATPase，把鉀移進細胞內，暫時降低血鉀，總鉀量不變。'},

    {n:'碳酸氫鈉', at:[1,4], how:'在酸中毒時讓氫離子出細胞、鉀進細胞；單獨使用效果有限，主要用於酸中毒或心跳停止情境。', adv:true},
    {n:'透析', at:[0], how:'真正把鉀移出身體的方法。院前角色是把病人送到做得到的地方。'}

  why:[
    {q:'鈣劑不會降鉀，為什麼還是第一個給？', a:'心臟的危險來自膜電位異常，不是鉀數字本身。鈣在幾分鐘內穩定心肌膜，替其他降鉀處置爭取時間。它是「護心」，不是「降鉀」。', adv:'鈣提高閾值電位，恢復靜止電位與閾值之間的差距。作用持續時間有限，降鉀處置要同時進行。傳統上對 digoxin 中毒病人給鈣持謹慎態度，近年證據認為風險可能被高估，依指引。'},
    {q:'Salbutamol 和胰島素都沒有把鉀排出去，為什麼有用？', a:'它們把血中的鉀暫時「藏」進細胞內，讓細胞外濃度下降，心肌膜電位恢復。總鉀量沒變，藥效退了鉀會跑回來，所以一定要接著透析或排鉀治療。'},
    {q:'為什麼心電圖正常不能排除高血鉀？', a:'心電圖變化與血鉀數值的相關性不好。慢性腎衰竭病人可能血鉀很高心電圖仍正常，也可能毫無預警直接進入致死心律。高風險病人要依臨床判斷處理。'},
    {q:'擠壓傷病人為什麼在救出的那一刻最危險？', a:'受壓的肌肉壞死，鉀、肌紅素、酸性物質留在局部。壓迫解除、血流恢復時，這些物質一次沖進循環，可能立刻造成心律不整與心跳停止。', adv:'依指引在解除壓迫前建立管路、輸液，並準備高血鉀處置。'},
    {q:'為什麼高血鉀會讓心跳變慢而不是變快？', a:'持續去極化讓鈉通道失活，電訊號傳導變慢，竇房結與房室結都受影響，結果是心搏過緩和傳導阻滯，最後可能停止。'}

/* ---------------------------------------------------------- 低體溫 */
{
  id:'hypothermia', zh:'低體溫', en:'Hypothermia', sec:'內科急症',
  core:'冷讓心臟變得一碰就亂，也讓大腦更耐缺氧。所以要輕輕搬，而且「暖了才算死」。',
  chain:[
    {t:'散熱大於產熱', d:'身體靠代謝與顫抖產熱，靠輻射、傳導、對流、蒸發散熱。泡在水裡、濕衣服、吹風、喝酒、年長、外傷，都讓散熱超過產熱。',
     adv:'水的導熱比空氣快很多，浸水低體溫進展特別快。酒精造成周邊血管擴張並抑制顫抖；老人、嬰兒、甲狀腺低下、低血糖、敗血症、頭部或脊髓損傷都會影響體溫調節。創傷病人的低體溫會加重凝血病變。',
     signs:['濕衣服、泡水','寒冷環境暴露時間長','酒精或藥物','老人獨居、跌倒久臥'], tx:['移離寒冷環境','脫除濕衣物']},
    {t:'顫抖期：代償', d:'核心體溫剛下降時，周邊血管收縮把熱留在核心，肌肉顫抖大量產熱。病人通常清醒，會冷、會抖。',
     adv:'大致對應輕度低體溫（約 32–35 °C）。顫抖會使耗氧量與能量消耗大幅增加，血糖與肝醣會被快速用掉。冷利尿（cold diuresis）：周邊收縮使中心血量增加，腎臟排出更多尿，造成低血容。',
     signs:['劇烈顫抖','皮膚冰冷蒼白','動作笨拙、口齒不清','心搏過速'], tx:['隔絕保暖','溫暖含糖飲料（清醒能吞嚥者）']},
    {t:'非顫抖期：代償失敗', d:'體溫繼續下降，顫抖停止，產熱能力大幅下降。病人意識混亂、反應變慢，有時會出現反常脫衣。',
     adv:'大致對應中度低體溫（約 28–32 °C），但個體差異大，國際常用以意識與顫抖分級（如 Swiss staging），因為院前很難量準核心體溫。代謝每降 1 °C 約下降 6–7%，心跳、呼吸逐步變慢。',
     signs:['顫抖停止','意識混亂或嗜睡','心搏過緩、呼吸變慢','反常脫衣、躲藏行為'], tx:['水平溫和搬運','主動體外復溫']},
    {t:'心肌易激性上升', d:'心臟越冷越容易被刺激出心室顫動。粗暴搬運、突然把病人立起來、大幅活動四肢，都可能觸發心跳停止。',
     adv:'低溫使心肌傳導變慢、不反應期不均勻，形成折返的條件。心電圖可見 Osborn（J）波、PR 與 QT 延長、心房顫動。從水中垂直拉起可能因水的靜水壓支撐突然消失、血液淤積在下肢，造成循環崩潰（circumrescue collapse），所以盡量水平救起。',
     signs:['心房顫動、心搏過緩','Osborn（J）波','移動後突然無脈搏'], tx:['水平姿勢','避免粗暴搬運','持續心律監測']},
    {t:'後降現象（afterdrop）', d:'救出後核心體溫還可能繼續下降。冷的四肢血液回到核心，加上核心的熱持續往冷的外殼傳。',
     adv:'機轉包含熱傳導梯度（核心熱持續往外流）與冷周邊血液回流。按摩四肢、讓病人走動、只溫暖四肢都可能加劇。復溫的重點放在軀幹。',
     signs:['救出後意識或心律反而變差'], tx:['優先溫暖軀幹','避免按摩四肢、避免讓病人走動']},
    {t:'嚴重低體溫 → 心跳停止', d:'體溫極低時心跳可能停止，但大腦因為冷而代謝很低，對缺氧的耐受度比常溫高得多。',
     adv:'嚴重低體溫心跳停止的病人，經體外循環維生系統（ECLS）復溫後可有良好神經預後。體溫很低時電擊與藥物的效果差，次數與間隔依指引調整。脈搏與呼吸可能非常微弱，評估需延長時間。',
     signs:['無意識','脈搏極慢或摸不到','瞳孔放大不代表死亡'], tx:['高品質 CPR','依指引調整電擊與藥物','送往有 ECLS 的醫院']}
  ],
  drugs:[
    {n:'被動復溫', at:[0,1], how:'移離寒冷、脫濕衣、包覆保溫與防風防水層，讓身體自己的產熱不再流失。顫抖期病人通常足夠。'},
    {n:'主動體外復溫', at:[2,4], how:'在軀幹（胸、腋下、背部）放置熱敷包或熱風毯，從外部加熱核心，減少後降。'},
    {n:'溫和水平搬運', at:[3], how:'避免機械刺激觸發心室顫動，減少冷血突然回流核心。'},
    {n:'溫熱靜脈輸液', at:[1,2], how:'矯正冷利尿造成的低血容；加溫只是避免輸液再降溫，本身產熱很少。', adv:true},
    {n:'葡萄糖', at:[1], how:'顫抖會快速消耗血糖，低血糖時要矯正。'},
    {n:'ECLS 體外循環', at:[5], how:'同時提供循環與快速核心復溫，是嚴重低體溫心跳停止病人存活的關鍵，院前角色是辨識並送往有能力的醫院。', adv:true}
  ],
  why:[
    {q:'為什麼低體溫病人要「輕輕搬」？', a:'冷的心臟很容易被刺激出心室顫動。粗暴搬運、突然坐起或站起，都可能讓原本有脈搏的病人瞬間心跳停止。盡量保持水平、動作平順。'},
    {q:'為什麼說「暖了才算死」？', a:'低溫讓大腦代謝大幅下降，可以撐過比常溫長很多的缺氧時間。冷的病人看起來像死了（無脈、瞳孔放大、僵硬），但復溫後仍可能存活且神經功能良好。所以除非有明顯致命傷或其他不可存活的證據，要持續急救並送往能復溫的醫院。', adv:'不適用的情境包括：明顯致命傷、全身凍硬無法壓胸、雪崩受困時間長且呼吸道被雪阻塞合併心搏停止等，依指引判斷。'},
    {q:'救出來之後為什麼病人可能反而變差？', a:'後降現象：冷的周邊血回流核心，加上熱持續從核心往外流，核心溫度繼續下降，心律可能惡化。所以要先溫暖軀幹，不要搓手腳或讓病人走動。'},
    {q:'為什麼顫抖是好現象，顫抖停止反而要擔心？', a:'顫抖是身體還有能力產熱的證據。顫抖停止，可能是體溫繼續下降、代償失敗，或能量耗盡。要搭配意識變化判斷。'},
    {q:'為什麼低體溫病人摸脈搏要摸久一點？', a:'低溫時心跳非常慢、周邊血管強烈收縮，脈搏可能極弱。太快判定無脈而開始壓胸，可能刺激一顆還在跳的心臟進入心室顫動。依指引延長評估時間，並搭配心電圖與 EtCO₂。'}
  ],

{
  id:'heat', zh:'中暑', en:'Heat-related Illness', sec:'內科急症',
  core:'熱中暑的傷害取決於「高溫持續多久」。先在現場降溫，再送醫，順序不能顛倒。',
  chain:[
    {t:'產熱大於散熱', d:'運動與代謝產熱；身體靠輻射、傳導、對流與流汗蒸發散熱。氣溫接近體溫時，主要只剩流汗；濕度高時，汗蒸發不了，散熱幾乎失效。',
     adv:'運動時肌肉產熱可增加十倍以上。危險因子：未熱適應、脫水、肥胖、發燒、穿著厚重裝備（消防、軍隊）、藥物（抗膽鹼、利尿劑、β 阻斷劑、抗精神病藥、興奮劑）。',
     signs:['高溫高濕環境','劇烈運動、重裝','老人、慢性病、用藥'], tx:['移到陰涼處','脫除多餘衣物裝備']},
    {t:'循環重新分配', d:'為了散熱，大量血液流向皮膚；運動時肌肉也要血；加上流汗失水。心臟要同時供應皮膚、肌肉與內臟，回心血量下降。',
     adv:'內臟血管收縮讓腸道缺血。心輸出量的需求上升，脫水使前負荷下降，心搏過速代償。',
     signs:['心搏過速','姿勢性頭暈、昏倒','大量出汗、口渴'], tx:['平躺抬腿','口服或靜脈補液']},
    {t:'熱衰竭：中樞仍正常', d:'脫水與循環代償不足：疲倦、頭痛、噁心、頭暈、昏倒。核心體溫可能上升但通常低於 40 °C，意識基本正常。',
     adv:'熱衰竭與熱中暑是連續光譜，不是兩個獨立疾病。區分的關鍵是中樞神經功能：只要有意識改變、行為異常、抽搐，就當作熱中暑處理。',
     signs:['意識清楚','疲倦、頭痛、噁心','皮膚濕冷或潮紅'], tx:['休息降溫','補充水分與電解質']},
    {t:'熱中暑：中樞功能失調', d:'核心溫度通常超過 40 °C，合併中樞神經異常：混亂、胡言亂語、攻擊、抽搐、昏迷。這是急症，死亡率高。',
     adv:'運動型（exertional）常見於年輕運動員、軍人、消防員，進展快，常仍在流汗；典型（classic）見於熱浪中的老人、慢性病與用藥者，數天累積，皮膚常乾熱。無汗不是診斷必要條件。準確的核心溫度需用直腸溫，耳溫、額溫、腋溫會低估。',
     signs:['意識改變、行為怪異','抽搐','核心溫度很高','皮膚熱（乾或濕都可能）'], tx:['立即冷水浸泡','保護呼吸道']},
    {t:'細胞熱傷害與全身發炎', d:'高溫直接破壞細胞蛋白與細胞膜。腸道缺血讓細菌毒素進入血液，引發全身發炎反應。',
     adv:'熱細胞毒性加上內毒素血症造成類似敗血症的 SIRS，血管內皮受損，啟動凝血。傷害程度與「高溫 × 時間」相關，這是為什麼降溫速度決定預後。',
     signs:['低血壓','心搏過速','嘔吐、腹瀉'], tx:['持續降溫','輸液（依指引）']},
    {t:'多器官衰竭', d:'腦、肝、腎、肌肉、凝血系統都會受損：橫紋肌溶解、急性腎損傷、肝衰竭、瀰漫性血管內凝血（DIC），可能在數小時到數天後才出現。',
     adv:'橫紋肌溶解可造成高血鉀與腎衰竭；DIC 造成出血傾向。即使現場降溫成功，仍需住院監測。',
     signs:['茶色尿','出血點、出血','持續昏迷','心律不整'], tx:['降溫後送醫','監測心律與血糖']}
  ],
  drugs:[
    {n:'冷水浸泡', at:[3,4], how:'水的導熱快，是降溫最快的方法。對運動型熱中暑證據最強，應在送醫前完成。'},
    {n:'蒸發與對流降溫', at:[3,4], how:'噴水加吹風，無法浸泡時（如老人、救護車內）的替代方式。冰敷包放在頸、腋、鼠蹊效果較慢。'},
    {n:'移到陰涼處、脫衣', at:[0], how:'停止繼續吸熱，增加散熱面積。'},
    {n:'補液', at:[1,2], how:'矯正脫水與循環不足。口服適用於清醒的熱衰竭；靜脈輸液依指引，不要過量。'},
    {n:'Benzodiazepine', at:[3], how:'控制抽搐與劇烈顫抖、躁動，減少肌肉產熱。', adv:true},
    {n:'退燒藥', at:[0], how:'無效。熱中暑不是體溫設定點上升，退燒藥作用不到；acetaminophen 還可能加重肝損傷。'}
  ],
  why:[
    {q:'為什麼要先降溫再送醫，而不是馬上送醫？', a:'器官傷害取決於高溫持續的時間。運送途中很難有效降溫，等到醫院可能已經過了黃金時間。在現場用冷水浸泡，通常十幾二十分鐘就能把溫度降到安全範圍，然後再送醫。', adv:'國際運動醫學共識常說「cool first, transport second」，並建議在約 39 °C 時停止積極降溫以避免過冷。降溫目標與方式依所屬機關指引。'},
    {q:'為什麼冷水浸泡比冰敷包有效？', a:'水的導熱比空氣快很多，全身浸泡的接觸面積大。冰敷包只接觸小面積，降溫速度慢很多。'},
    {q:'冷水浸泡會不會讓血管收縮、反而散不了熱？', a:'這是常見的疑慮，但研究顯示冷水浸泡仍是降溫最快的方法。皮膚血管收縮的影響遠小於水直接帶走熱量的效果。浸泡中出現顫抖不是停止降溫的理由，以核心溫度決定何時停止。'},
    {q:'為什麼退燒藥沒用？', a:'發燒是下視丘把體溫設定點調高，退燒藥把設定點調回來。中暑是散熱失效，設定點沒變，所以退燒藥作用不到，只能靠物理降溫。'},
    {q:'病人還在流汗，可以排除熱中暑嗎？', a:'不行。運動型熱中暑病人常常仍在大量流汗。判斷要看中樞神經功能：只要有意識改變或行為異常，就要當作熱中暑處理。'}
  ],

    {q:'熱浪期間獨居老人在家中被發現意識不清、皮膚乾熱。處置與運動型有什麼不同？為什麼？', guide:'引導比較典型與運動型：老人可能有心衰、用藥、脫水程度不同，冷水浸泡在住家較難執行，常用蒸發對流法。追問：用藥（利尿劑、抗膽鹼）如何影響散熱、輸液要多謹慎。', adv:true},

/* ---------------------------------------------------------- 急性行為障礙 */
{
  id:'abd', zh:'急性行為障礙', en:'Acute Behavioural Disturbance', sec:'精神與行為',
  core:'激躁的病人先當作「身體出了問題」來找原因。最危險的時刻，常常是病人突然安靜下來的那一刻。',
  chain:[
    {t:'器質性原因', d:'很多激躁行為背後是身體疾病：低血糖、缺氧、頭部外傷、中毒或戒斷、感染造成的譫妄、癲癇後、甲狀腺風暴、熱中暑。先排除這些，才能歸因於精神疾病。',
     adv:'院前常見的興奮劑（安非他命、古柯鹼、合成卡西酮）會大量釋放兒茶酚胺。酒精或 benzodiazepine 戒斷、抗膽鹼中毒、血清素症候群也要考慮。譫妄的特徵是急性發生、注意力不集中、意識程度起伏。',
     signs:['急性發生、意識起伏','注意力不集中、定向感差','藥物或酒精使用史','外傷痕跡'], tx:['測血糖','SpO₂','檢查頭部外傷','詢問用藥與病史']},
    {t:'交感神經過度興奮', d:'大量腎上腺素類物質讓心跳、血壓、呼吸都上升，病人力氣大、痛覺遲鈍、不聽指令。',
     adv:'心肌耗氧大增，可能誘發心肌缺血與心律不整。過去常用「激躁譫妄」（excited delirium）描述這種極端型，但此名詞因缺乏明確定義、可能被用於合理化執法暴力而受到多個醫學組織質疑，目前多以「急性行為障礙」或「重度激躁」描述。',
     signs:['心搏過速、高血壓','大量出汗','力氣異常大、對疼痛無反應','瞳孔放大'], tx:['降低刺激','尋求警方與後援協助']},
    {t:'肌肉過度活動 → 高熱', d:'持續掙扎與肌肉僵直大量產熱，加上興奮劑影響體溫調節，核心體溫可能急遽上升。',
     adv:'高熱本身就是死亡的獨立危險因子，處理方式同熱中暑：積極降溫。多巴胺與血清素失調也影響下視丘體溫調節。',
     signs:['皮膚燙、大量出汗','脫衣服（感覺很熱）','高熱'], tx:['積極降溫','控制肌肉活動']},
    {t:'乳酸酸中毒與高血鉀', d:'肌肉在缺氧下劇烈運動產生大量乳酸，血液變酸。肌肉細胞破裂（橫紋肌溶解）釋出鉀。病人必須呼吸很快才能把 CO₂ 排掉，代償酸中毒。',
     adv:'持續掙扎可讓 pH 急遽下降。酸中毒讓鉀從細胞內移出，加上橫紋肌溶解，血鉀上升。呼吸代償是維持 pH 的關鍵：任何限制呼吸的因素（壓制、鎮靜）都可能讓 pH 崩潰。',
     signs:['呼吸急促','EtCO₂ 一開始偏低（代償）','茶色尿'], tx:['不要限制呼吸','監測 EtCO₂']},
    {t:'壓制體位與限制呼吸', d:'俯臥壓制、壓背、壓頸，會限制胸廓與橫膈活動。病人正需要大口呼吸來排酸，這時被壓住，等於切斷代償。',
     adv:'壓制相關死亡（restraint-related death）常見模式：長時間掙扎後被俯臥壓制，病人突然安靜，接著心跳停止。機轉包括呼吸受限、酸中毒加劇、高血鉀、兒茶酚胺心肌毒性。',
     signs:['被壓在地上、俯臥','說「我不能呼吸」','掙扎突然停止'], tx:['盡快改為側臥或坐姿','不壓胸、背、頸']},
    {t:'鎮靜後呼吸抑制 → 心跳停止', d:'鎮靜藥能停止掙扎，但也可能抑制呼吸與呼吸道反射。酸中毒病人一旦呼吸變慢，pH 迅速下降，可能突然心跳停止。',
     adv:'鎮靜藥物選擇（ketamine、benzodiazepine、droperidol 等抗精神病藥）依所屬機關指引。Ketamine 保留呼吸驅動較多，但可能造成喉痙攣、分泌物增加；benzodiazepine 與酒精併用易抑制呼吸；抗精神病藥要注意 QT 延長。鎮靜後立即放側臥、持續 SpO₂ 與 EtCO₂ 監測，準備呼吸道處置。',
     signs:['突然安靜、無反應','呼吸變慢或打鼾聲','SpO₂ 下降、EtCO₂ 上升','心搏過緩'], tx:['持續監測 SpO₂ 與 EtCO₂','側臥','準備呼吸道處置與輔助通氣']}
  ],
  drugs:[
    {n:'降低刺激（言語降溫）', at:[1], how:'減少聲光與人數、一人溝通、給空間，降低交感興奮，是所有處置的第一步。'},
    {n:'測血糖、給氧', at:[0], how:'快速排除低血糖與缺氧這兩個最容易矯正的原因。'},
    {n:'安全體位', at:[4], how:'避免俯臥與壓迫胸背頸，讓病人能用呼吸代償酸中毒。'},
    {n:'降溫', at:[2], how:'處理高熱，降低代謝與耗氧。'},
    {n:'鎮靜藥物', at:[1,2,3], how:'停止肌肉活動，減少產熱與產酸，讓評估與處置能安全進行。代價是呼吸道與呼吸風險。', adv:true},
    {n:'持續監測與呼吸道準備', at:[5], how:'鎮靜後最危險的時刻，SpO₂ 與 EtCO₂ 能最早發現呼吸抑制。'}
  ],

    {t:'骨折出血', d:'骨頭內血流豐富，周圍肌肉與血管也會出血。股骨閉鎖性骨折可在大腿內流失大量血液；骨盆骨折可出血更多，足以致命。',
     adv:'教學近似值：脛骨約數百毫升、單側股骨約 1–1.5 公升、骨盆可達數公升（主要來自骨盆後方靜脈叢與骨折面，少數為動脈）。大腿接近圓柱，直徑稍微增加，容積就大幅增加。',
     signs:['大腿腫脹變粗','骨盆疼痛、雙腿長度不等或外旋','心搏過速、皮膚濕冷'], tx:['骨盆帶','牽引夾板（股骨幹骨折）','保暖']},
    {t:'神經血管受損', d:'移位的骨折或脫臼會拉扯、壓迫或撕裂血管與神經。遠端沒有脈搏的肢體，缺血時間越長，存活越困難。',
     adv:'高風險組合：膝關節脫臼（膕動脈）、肱骨髁上骨折（肱動脈與正中神經）、髖關節後脫位（坐骨神經、股骨頭缺血性壞死）、肩關節脫臼（腋神經）。膝脫臼可能已自行復位，遠端脈搏正常也不代表動脈內膜沒有受傷。',

    {t:'疼痛、肌肉痙攣與斷端移動', d:'劇痛讓肌肉強烈收縮，斷端互相重疊並持續移動，造成更多出血與軟組織傷害。',
     adv:'股骨幹骨折時大腿肌群收縮使斷端重疊，大腿變短變粗。牽引恢復長度後，大腿回到接近圓柱的原始形狀，容積下降、出血空間減少，疼痛也明顯下降。',
     signs:['劇烈疼痛','肢體縮短','肌肉痙攣'], tx:['止痛（依指引）','夾板固定','牽引夾板']},
    {t:'腔室症候群', d:'肌肉被包在不能延展的筋膜腔室裡。出血與水腫讓腔室壓力上升，超過微血管灌流壓後肌肉與神經缺血，形成惡性循環。',
     adv:'早期最可靠的線索是與傷勢不成比例的疼痛，以及被動伸展肌肉時劇痛。遠端脈搏消失是晚期徵象，因為腔室壓力要接近或超過動脈壓才會壓掉大動脈，而肌肉在更低的壓力下就已缺血。好發於小腿與前臂，也見於擠壓傷、過緊的石膏或夾板。懷疑時肢體維持在心臟高度，不要過度抬高。',
     signs:['疼痛越來越劇烈、止痛效果差','被動伸展手指或腳趾時劇痛','腔室緊繃','感覺異常'], tx:['鬆開過緊的夾板或包紮','肢體維持心臟高度','預警需緊急筋膜切開']},
    {t:'低血容休克與肢體喪失', d:'多處長骨或骨盆骨折可以造成出血性休克。持續缺血的肢體會壞死，最終可能截肢；開放性骨折延遲處理則增加骨髓炎風險。',

{
  id:'pph', zh:'產後出血', en:'Postpartum Haemorrhage', sec:'產科',
  core:'子宮靠自己的肌肉夾住血管止血。子宮不收縮，胎盤剝離處就像一個打開的大水龍頭。',
  chain:[
    {t:'胎盤剝離面暴露', d:'足月時子宮血流非常大，大約每分鐘 500–700 mL。胎盤剝離後，子宮壁留下一大片暴露的血管。',
     adv:'胎盤床的螺旋動脈在懷孕期間被重塑成低阻力、大口徑的血管，本身幾乎沒有收縮能力，止血完全依賴周圍肌肉壓迫。產後纖維蛋白溶解活性也會短暫上升。',
     signs:['胎盤剛娩出或尚未娩出','陰道出血'], tx:['確認胎盤是否娩出、是否完整','評估出血量與速度']},
    {t:'子宮收縮止血（生物結紮）', d:'子宮肌纖維交錯包圍血管，收縮時像繩子一樣把血管勒緊，稱為「生物結紮」（living ligatures）。這是產後止血最主要的機制，凝血只是輔助。',
     adv:'Oxytocin 經由子宮肌層的 Gq 受體使細胞內鈣上升，引起收縮；足月時受體數量大增，所以對 oxytocin 特別敏感。膀胱脹滿會妨礙子宮收縮。肌膚接觸與吸吮會刺激產婦腦下垂體釋放內生性 oxytocin。',
     signs:['子宮摸起來硬、像網球（收縮良好）','子宮軟、摸不清楚、位置高於肚臍（收縮不良）'], tx:['子宮按摩','肌膚接觸、哺乳','排空膀胱','Oxytocin（依指引）']},
    {t:'4T：止血失敗的四種原因', d:'Tone（子宮收縮不良，最常見）、Trauma（產道撕裂、子宮破裂或內翻）、Tissue（胎盤或胎膜殘留）、Thrombin（凝血功能異常）。找出是哪一個 T，處置才有方向。',
     adv:'Tone 約占七成，危險因子包括多胎、巨嬰、羊水過多、產程過長或過快、多產、感染。子宮硬但仍持續鮮紅出血，要想到 Trauma；胎盤不完整要想到 Tissue；滲血不止、注射處出血要想到 Thrombin（胎盤早期剝離、羊水栓塞、HELLP 可導致 DIC）。',
     signs:['子宮軟（Tone）','子宮硬但持續鮮紅出血（Trauma）','胎盤缺損（Tissue）','血液不凝、注射處滲血（Thrombin）'], tx:['觸摸子宮底','檢查會陰撕裂並直接加壓','保留胎盤送醫檢查']},
    {t:'大量快速失血', d:'出血可以非常快，幾分鐘內就失去大量血液。出血量常被肉眼低估，因為血會被床單、衣物吸收，或積在子宮與陰道內。',
     adv:'產後出血常見定義為產後 24 小時內失血 500 mL 以上，1000 mL 以上為嚴重；24 小時到 12 週內為晚發性。院前不需要精算，重點是出血速度與病人反應。秤重或計算浸濕的護墊比目測準確。',
     signs:['護墊、床單浸濕','血塊','持續鮮紅色出血'], tx:['計算浸濕的護墊','儘早預警','建立靜脈管路（依指引）']},
    {t:'孕婦生理代償使休克徵象延後', d:'懷孕時血液量增加約四到五成，產婦通常年輕健康，可能失血超過 1000 mL 才出現血壓下降。心跳上升、焦躁、皮膚蒼白可能是唯一的早期線索。',
     adv:'孕期本來心跳就較快、血壓偏低，正常值的判斷要調整。休克指數（shock index = HR ÷ SBP）在產科常用於早期警示，數值接近或超過 1 時要高度警覺。血壓下降時，往往已經失去大量血液。',
     signs:['心搏過速','焦躁不安','皮膚蒼白濕冷','微血管回填變慢','休克指數上升'], tx:['連續監測','計算休克指數','不要被正常血壓安心']},
    {t:'失代償與致命三角', d:'代償用盡後血壓快速下降，灌流不足造成酸中毒。低體溫、酸中毒、凝血病變互相惡化，凝血因子越用越少，出血越來越難止。',
     adv:'大量晶體液稀釋凝血因子並降低體溫，可能加重 Thrombin 問題。Tranexamic acid 抑制纖維蛋白溶解，在產後 3 小時內給予可降低出血死亡率，越早越好；超過 3 小時沒有效益。輸液與用藥依所屬機關指引。',
     signs:['低血壓','意識改變','體溫下降','血液不凝'], tx:['保暖','Tranexamic acid（依指引）','避免過量晶體液']},
    {t:'出血性休克 → 心跳停止', d:'若出血持續沒有控制，最後以低血容休克造成的心跳停止收場。產後出血是全球孕產婦死亡的主要原因之一。',
     adv:'產後出血造成的心跳停止屬可逆原因（低血容）。止血與恢復血容量的根本治療在醫院，院前的關鍵是早期辨識、早期處置、早期預警並快速轉送到有產科與輸血能力的醫院。',
     signs:['無脈搏','PEA'], tx:['高品質 CPR','處理可逆原因','快速轉送']}

  why:[
    {q:'為什麼產後出血先摸子宮，而不是先看陰道？', a:'七成的產後出血來自子宮收縮不良。摸子宮底只要幾秒鐘：軟的就是 Tone，立刻按摩；硬的但仍在出血，就去找撕裂（Trauma）。這一個動作就把 4T 分成兩條路。'},

    {q:'子宮按摩很痛，為什麼還要做？', a:'子宮收縮是唯一能快速夾住胎盤剝離處血管的機制。按摩刺激肌肉收縮，直接作用在出血的源頭。先向產婦說明原因，持續按摩到子宮變硬，鬆手後要再檢查是否又變軟。'},
    {q:'為什麼 tranexamic acid 有時間窗？', a:'產後纖維蛋白溶解活性上升，tranexamic acid 保護已形成的血塊。大型研究顯示產後 3 小時內給予能降低出血死亡，越早效益越大，延遲越久效益越少。所以給藥時間要以「出生時間」計算，記錄出生時間很重要。', adv:'延遲給藥的效益下降可能與出血後期凝血狀態改變有關。劑量與途徑依所屬機關指引。'},
    {q:'為什麼不建議大量快速灌晶體液把血壓拉上來？', a:'晶體液不帶凝血因子也不帶氧氣，大量輸入會稀釋凝血因子、降低體溫，可能讓出血更難止。院前輸液目標與量依指引，重點是止血與快速轉送。'}

{
  id:'preeclampsia', zh:'子癇前症與子癇', en:'Pre-eclampsia & Eclampsia', sec:'產科',
  core:'問題從胎盤血管開始，卻傷害全身血管內皮。高血壓只是表象，腦、肝、腎、肺都可能出事。',
  chain:[
    {t:'胎盤血管重塑失敗', d:'正常懷孕時，胎盤細胞會把子宮的螺旋動脈改造成又寬又軟的血管。子癇前症的病人這個改造不完全，血管仍然狹窄、阻力高。',
     adv:'滋養層細胞侵入不足，螺旋動脈保留平滑肌與高阻力特性。這個過程在懷孕早中期就發生，但臨床症狀通常在 20 週以後才出現。危險因子包括初次懷孕、多胎、慢性高血壓、腎臟病、糖尿病、自體免疫疾病、過去有子癇前症病史。',
     signs:['懷孕 20 週以後','危險因子（初產、多胎、慢性高血壓等）','胎兒生長遲滯'], tx:['詢問週數與產檢紀錄','詢問過去病史']},
    {t:'胎盤缺血釋放有害因子', d:'缺血的胎盤釋放一些物質到母親血液中，干擾血管內皮的正常功能。',
     adv:'抗血管新生因子（如 sFlt-1、soluble endoglin）上升，胎盤生長因子（PlGF）下降，使內皮細胞失去保護。這也是為什麼胎盤娩出後病情才會逐漸緩解，以及部分醫院用 sFlt-1／PlGF 比值輔助診斷。',
     signs:['臨床上尚無明顯表現'], tx:['確定治療是讓胎盤娩出（醫院決定時機）']},
    {t:'全身血管內皮功能障礙', d:'內皮受損後會同時發生三件事：血管收縮（高血壓）、血管滲漏（水腫）、凝血活化（血小板下降）。',
     adv:'一氧化氮與前列環素減少、內皮素與血栓素增加。血管滲漏造成「組織水腫但血管內容積不足」的矛盾狀態，加上膠體滲透壓下降，容易發生肺水腫。常見診斷標準為 20 週後血壓 140/90 mmHg 以上合併蛋白尿或器官功能異常；160/110 mmHg 以上為重度。',
     signs:['血壓升高','臉部、手部突然水腫','體重快速增加'], tx:['測量並記錄血壓','重複測量看趨勢']},
    {t:'多器官受損', d:'腎、肝、肺、血液、胎盤都可能受影響。院前看得到的線索是上腹痛、尿量減少、呼吸困難、胎動減少。',
     adv:'肝：肝細胞缺血與肝包膜腫脹造成右上腹或上腹痛，嚴重時肝包膜下出血甚至破裂。HELLP 症候群：溶血、肝指數上升、血小板低下，血壓可能只是輕度上升。腎：蛋白尿、少尿。肺：微血管滲漏造成肺水腫。胎盤：胎兒生長遲滯、胎盤早期剝離（腹痛、陰道出血、子宮變硬）。',
     signs:['右上腹或上腹痛（常被當成胃痛）','噁心嘔吐','呼吸困難、濕囉音','胎動減少','腹痛合併陰道出血'], tx:['避免大量輸液','監測呼吸與 SpO₂','預警產科']},
    {t:'腦血流自動調節失效', d:'血壓太高、內皮又受損，腦血管無法維持穩定的血流，液體滲入腦組織造成腦水腫。病人會頭痛、視力模糊、看到閃光。',
     adv:'相當於後可逆性腦病變症候群（PRES），以枕葉為主，所以視覺症狀常見。腦出血是子癇前症孕產婦死亡的重要原因，與收縮壓過高密切相關，這是醫院積極處理重度高血壓的理由。',
     signs:['劇烈或持續頭痛','視力模糊、閃光、盲點','反射亢進、陣攣','躁動或意識改變'], tx:['安靜環境、減少不必要刺激','預警產科','準備處理抽搐']},
    {t:'子癇抽搐', d:'子癇是子癇前症病人出現全身性強直陣攣抽搐。抽搐期間產婦缺氧，胎兒也跟著缺氧。',
     adv:'Magnesium 是預防與治療子癇抽搐的首選，效果優於 diazepam 與 phenytoin。機轉包括阻斷 NMDA 受體、拮抗鈣離子、使腦血管擴張並減輕血管痙攣、保護血腦屏障。它不是主要的降壓藥。Magnesium 由腎臟排出，少尿時容易累積；中毒表現依序為深部肌腱反射消失、呼吸抑制、心臟傳導異常，拮抗劑為鈣劑，皆依所屬機關指引。抽搐持續或無 magnesium 時依指引使用 benzodiazepine。',
     signs:['全身強直陣攣抽搐','抽搐後意識不清','發紺','咬傷舌頭'], tx:['保護病人、側臥（懷孕時左側臥）','打開氣道、給氧','Magnesium（依指引）','測血糖']},
    {t:'腦出血、胎盤早期剝離、多器官衰竭', d:'最壞的結局包括腦出血、肺水腫、肝破裂、胎盤早期剝離、DIC，以及產婦或胎兒死亡。',
     adv:'確定治療是讓胎盤娩出，但分娩後仍可能惡化或才開始發病。產後子癇前症大多發生在產後 48 小時內，但可延至產後 6 週；子癇有相當比例（文獻常見約三分之一）發生在產後。',
     signs:['持續意識不清或偏癱','嚴重呼吸困難','劇烈腹痛、子宮僵硬','休克'], tx:['快速轉送到有產科與加護能力的醫院','持續監測氣道與呼吸']}

const advBox = (txt,label='進階層')=> txt ? `<div class="advbox adv-only"><b class="lv">${label}</b>${txt}</div>` : '';

function caseDone(id){
  const c=byId[id]; const st=S.cases[id]; if(!st) return 0;
  const stages=c.cases[0].stages.map((s,i)=>({s,i})).filter(o=>!o.s.lvl||isAdv());
  const n=stages.filter(o=>st.ans&&st.ans[o.i]!=null).length;
  return Math.round(n/stages.length*100);
}

/* ---- 處置模擬 ---- */
const VMETA={
  HR:{l:'HR',u:'',min:0,max:220,bad:v=>v>120||v<50},
  RR:{l:'RR',u:'',min:0,max:60,bad:v=>v>28||v<10},
  SBP:{l:'收縮壓',u:'mmHg',min:0,max:260,bad:v=>v<90||v>180},
  SpO2:{l:'SpO₂',u:'%',min:50,max:100,bad:v=>v<92},
  GCS:{l:'GCS',u:'',min:3,max:15,bad:v=>v<13},
  EtCO2:{l:'EtCO₂',u:'mmHg',min:0,max:100,bad:v=>v<30||v>45},
  BGL:{l:'BGL',u:'mmol/L',min:0.5,max:40,bad:v=>v<4||v>15},
  T:{l:'體溫',u:'°C',min:25,max:44,bad:v=>v<35||v>38.5},
  Pain:{l:'疼痛',u:'/10',min:0,max:10,bad:v=>v>=7}
};
function fmtV(k,v){ if(k==='BGL') return v.toFixed(1)+`<small> (${Math.round(v*18)} mg/dL)</small>`; if(k==='T') return v.toFixed(1); return Math.round(v); }
function paneSim(c,pane){
  const sm=c.sim;
  const st=S.sim[c.id]||(S.sim[c.id]={v:{...sm.start},used:[],log:[],t:0});
  const acts=sm.acts.map((a,i)=>({a,i})).filter(o=>!o.a.adv||isAdv());
  const prev=st.prev||st.v;
  const last=st.log[st.log.length-1];
  pane.innerHTML=`<div class="simgrid">
      <div class="card simvit">
        <p class="simintro"><span class="eyebrow">情境</span> ${sm.intro}</p>
        <div class="simv">${Object.keys(sm.start).map(k=>{const m=VMETA[k],v=st.v[k],d=v-(prev[k]??v);
          return `<div class="sv${m.bad(v)?' bad':''}"><span>${m.l}</span><b class="mono">${fmtV(k,v)}</b><em>${m.u}${d?` <i class="${d>0?'up':'dn'}">${d>0?'▲':'▼'}${k==='BGL'||k==='T'?Math.abs(d).toFixed(1):Math.abs(Math.round(d))}</i>`:''}</em></div>`}).join('')}</div>
        <p class="muted simt" style="font-size:.86rem">已經過 ${st.t} 個時間單位（約 5 分鐘）。<span class="dsk">未處置時：${sm.decline.text}</span></p>
        ${last?`<p class="simlast ${last.ok===true?'ok':last.ok===false?'no':''}"><b>${last.n}</b>　${last.fb}</p>`:''}
      </div>
      <div class="ctl card simact">
        <b>選擇處置</b>
        <p class="muted" style="font-size:.86rem">每個處置只能選一次。先想好它作用在機轉鏈的哪一環，再按下去。</p>
        <div class="simacts">${acts.map(({a,i})=>`<button class="opt${st.used.includes(i)?(a.ok===true?' right':a.ok===false?' wrong':' used'):''}" data-a="${i}" ${st.used.includes(i)?'disabled':''}>${a.n}${a.adv?' <span class="tag adv">進階</span>':''}${lvBadge(c,a.n)}</button>`).join('')}</div>
        <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary" id="simt">時間經過</button><button class="btn" id="simr">重設</button></div>
      </div>
      <div class="card stack simlogc" style="gap:8px"><b style="font-size:.92rem">處置紀錄</b>
        ${st.log.length?`<ol class="simlog">${st.log.slice().reverse().map(l=>`<li class="${l.ok===true?'ok':l.ok===false?'no':''}"><b>${l.n}</b>${l.fb}</li>`).join('')}</ol>`:'<p class="muted" style="font-size:.9rem">還沒有處置。選一個處置，或讓時間經過看看病人會怎麼變化。</p>'}
      </div>
    </div>`;
  const apply=d=>{ st.prev={...st.v}; for(const [k,x] of Object.entries(d)){ if(!(k in st.v)) continue; const m=VMETA[k]; st.v[k]=clamp(st.v[k]+x,m.min,m.max);} };
  pane.onclick=e=>{
    const b=e.target.closest('[data-a]');
    if(b&&!b.disabled){const i=+b.dataset.a,a=sm.acts[i]; apply(a.d); st.used.push(i); st.log.push({n:a.n,fb:a.fb,ok:a.ok}); paneSim(c,pane); return;}
    if(e.target.id==='simt'){apply(sm.decline.d); st.t++; st.log.push({n:'時間經過',fb:sm.decline.text,ok:null}); paneSim(c,pane); return;}
    if(e.target.id==='simr'){delete S.sim[c.id]; paneSim(c,pane);}
  };
}

/* ---- 測驗 ---- */
function paneQuiz(c,pane){
  const list=c.quiz.map((q,i)=>({q,i})).filter(o=>!o.q.adv||isAdv());
  const st=S.quiz[c.id]||(S.quiz[c.id]={});
  const answered=list.filter(o=>st[o.i]!=null), right=answered.filter(o=>st[o.i]===o.q.a).length;
  const done=answered.length===list.length;
  if(done){ const sc=Math.round(right/list.length*100); if(S.quizBest[c.id]==null||sc>S.quizBest[c.id]){S.quizBest[c.id]=sc;store.set('quizBest',S.quizBest);} }
  pane.innerHTML=`<div class="stack" style="gap:12px">
    <div class="casebar"><span class="status ${done?(right/list.length>=.8?'ok':'mid'):''}">已作答 ${answered.length}/${list.length}　答對 ${right}</span>${S.quizBest[c.id]!=null?`<span class="muted" style="font-size:.88rem">最佳成績 ${S.quizBest[c.id]}%</span>`:''}<button class="btn sm" id="qr">重新作答</button></div>
    ${list.map(({q,i},k)=>{const a=st[i];return `<div class="stage">
      <p style="font-weight:700"><span class="mono muted">${k+1}. </span>${q.q}${q.adv?' <span class="tag adv">進階</span>':''}</p>
      <div class="opts">${q.opts.map((o,j)=>{let cls='';if(a!=null){if(j===q.a)cls=' right';else if(j===a)cls=' wrong';}
        return `<button class="opt${cls}" data-q="${i}" data-o="${j}" ${a!=null?'disabled':''}><span class="mono muted">${'ABCD'[j]}</span>　${o}</button>`}).join('')}</div>
      ${a!=null?`<div class="fb ${a===q.a?'ok':'no'}"><b>${a===q.a?'正確。':'答案是 '+'ABCD'[q.a]+'。'}</b>${q.exp}</div>`:''}
    </div>`}).join('')}
  </div>`;
  pane.onclick=e=>{
    const b=e.target.closest('[data-q]'); if(b&&!b.disabled){st[+b.dataset.q]=+b.dataset.o; paneQuiz(c,pane); return;}
    if(e.target.id==='qr'){S.quiz[c.id]={}; paneQuiz(c,pane);}
  };
}

  const dSel=S.drug[c.id];

  const mob=isMobile();
  const n=c.chain[Math.max(sel,0)];
  const detail=`

        <h3>${n.t}</h3>
        <p>${n.d}</p>

    <div class="card stack" style="gap:10px;padding:14px 16px">
      <div class="drugrow"><b style="font-size:.92rem">處置作用在哪一環？</b>${drugs.map(d=>`<button class="chip${d.adv?' advc':''}" data-d="${d.n}" aria-pressed="${d.n===dSel}">${d.n}${lvBadge(c,d.n)}</button>`).join('')}</div>
      ${dObj?`<div class="drugnote"><b>${dObj.n}</b>：${dObj.how}${dObj.at.length?`<br><span class="muted" style="font-size:.86rem">作用環節：${dObj.at.map(i=>(i+1)+'. '+c.chain[i].t).join('、')}</span>`:'<br><span class="muted" style="font-size:.86rem">不作用在這條因果鏈的關鍵環節。</span>'}</div>`:'<p class="muted" style="font-size:.88rem">點一個處置，因果鏈上它作用的環節會亮起綠色。</p>'}
    </div>
    <div class="chainwrap">

      ${mob?'':`<div class="card detail">${detail}</div>`}
      </div>
    </div>
  </div>`;
  pane.onclick=e=>{
    const nd=e.target.closest('.node'); if(nd){const i=+nd.dataset.i; S.node[c.id]=(isMobile()&&sel===i)?-1:i; paneChain(c,pane); if(isMobile()&&S.node[c.id]>=0){const el=pane.querySelector('.node[data-i="'+i+'"]'); el&&el.scrollIntoView({block:'nearest',behavior:'smooth'});} return;}

  };
}

/* ---- case ---- */
function vitalsHtml(v){
  const bad={HR:x=>x>120||x<50,RR:x=>x>28||x<10,SpO2:x=>parseInt(x)<92,BP:x=>parseInt(x)<90||parseInt(x)>180,EtCO2:x=>parseInt(x)>45||parseInt(x)<30};
  const lab={HR:'HR',RR:'RR',BP:'BP',SpO2:'SpO₂',EtCO2:'EtCO₂',T:'體溫',BGL:'BGL'};
  return `<div class="vitals">${Object.entries(v).map(([k,x])=>`<span class="vital${bad[k]&&bad[k](x)?' bad':''}">${lab[k]||k} <b>${x}</b></span>`).join('')}</div>`;
}
function paneCase(c,pane){
  const cs=c.cases[0];
  const st=S.cases[c.id]||(S.cases[c.id]={ans:{}});
  const list=cs.stages.map((s,i)=>({s,i})).filter(o=>!o.s.lvl||isAdv());
  let html=`<div class="case">
    <div class="card stack" style="gap:8px"><span class="eyebrow">病例</span><h3>${cs.title}</h3><p>${cs.intro}</p></div>`;
  for(let k=0;k<list.length;k++){
    const {s,i}=list[k]; const a=st.ans[i];
    html+=`<div class="stage">
      <div class="sh"><span class="stepbadge">推理步驟：${s.step}</span><span class="muted mono" style="font-size:.82rem">階段 ${k+1}/${list.length}</span>${s.lvl?'<span class="tag adv">進階層</span>':''}</div>
      <p>${s.info}</p>${vitalsHtml(s.vit)}
      <p style="font-weight:700">${s.q}</p>
      <div class="opts">${s.opts.map((o,j)=>{
        let cls=''; if(a!=null){ if(o.ok) cls=' right'; else if(j===a) cls=' wrong'; }
        return `<button class="opt${cls}" data-s="${i}" data-o="${j}" ${a!=null?'disabled':''}>${o.t}</button>`}).join('')}</div>
      ${a!=null?`<div class="fb ${s.opts[a].ok?'ok':'no'}"><b>${s.opts[a].ok?'判斷正確。':'再想想。'}</b>${s.opts[a].fb}${s.opts[a].ok?'':`<br><b>較合理的答案：</b>${s.opts.find(o=>o.ok).t}。${s.opts.find(o=>o.ok).fb}`}</div><p class="teach">${s.teach}</p>`:''}
    </div>`;
    if(a==null) break;
  }
  const done=list.every(o=>st.ans[o.i]!=null);
  const hasAdv=cs.stages.some(x=>x.lvl);
  html+=`<div class="casebar">${done?`<span class="status ok">病例完成。${hasAdv&&!isAdv()?'切換到進階層可以看到更多階段。':''}</span>`:''}<button class="btn sm" id="rst">重新開始</button></div></div>`;
  pane.innerHTML=html;
  pane.onclick=e=>{
    const b=e.target.closest('.opt'); if(b&&!b.disabled){ st.ans[+b.dataset.s]=+b.dataset.o; store.set('cases',S.cases); paneCase(c,pane); return; }
    if(e.target.id==='rst'){ S.cases[c.id]={ans:{}}; store.set('cases',S.cases); paneCase(c,pane); }
  };
}

/* 氣喘：Poiseuille */
poiseuille(pane){
  pane.innerHTML=`<div class="model">
    <div class="stack" style="gap:12px">
      <div class="viz"><svg id="pv" viewBox="0 0 440 250" role="img" aria-label="支氣管橫切面"></svg></div>
      <div class="formula">阻力 R ∝ 1 / r⁴　　（Poiseuille 定律：半徑減半 → 阻力 ×16）</div>
    </div>
    <div class="ctl card">
      ${slider('pr','支氣管管腔半徑',25,100,1,100,'往左拉：平滑肌收縮、黏膜水腫、黏液栓讓管徑變小')}
      <div class="meters" id="pm"></div>
      <div class="status" id="ps"></div>
      <p id="pt" style="font-size:.94rem"></p>
      ${advBox('這個模型假設層流，實際氣道多處為紊流（阻力更高）。重點在於：管徑小幅變化，就會造成阻力與呼吸功不成比例地上升。')}
    </div></div>`;
  const r=$('#pr',pane);
  const draw=()=>{
    const v=+r.value; $('#pro',pane).textContent=v+'%';
    const R=Math.pow(100/v,4);
    const flow=clamp(4/R,0,1);              // 病人最多能把驅動壓提高到 4 倍
    const effort=clamp(R,1,4);
    const narrow=1-v/100;
    const wheeze=clamp((0.85-v/100)/0.25,0,1)*clamp((flow-0.10)/0.30,0,1);
    const cx=150,cy=125,outer=105,lumen=78*v/100;
    const wall=outer-12;
    const mucus=v<62?`<ellipse cx="${cx+lumen*.35}" cy="${cy+lumen*.25}" rx="${(62-v)*.45}" ry="${(62-v)*.3}" fill="#d9c27a" opacity=".9"/>`:'';
    const arrows=Math.round(flow*6);
    let arr=''; for(let k=0;k<arrows;k++){const y=40+k*30; arr+=`<path d="M300 ${y} h90" stroke="var(--accent)" stroke-width="3" marker-end="url(#ah)"/>`;}
    $('#pv',pane).innerHTML=`
      <defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="var(--accent)"/></marker></defs>
      <circle cx="${cx}" cy="${cy}" r="${outer}" fill="var(--bg)" stroke="var(--line)" stroke-width="2"/>
      <circle cx="${cx}" cy="${cy}" r="${wall}" fill="var(--path)" opacity="${0.12+narrow*0.6}"/>
      <circle cx="${cx}" cy="${cy}" r="${lumen}" fill="var(--surface)" stroke="var(--path)" stroke-width="1.5"/>
      ${mucus}
      <text x="${cx}" y="${cy+wall-10}" text-anchor="middle" font-size="13" fill="var(--ink)" font-family="var(--mono)">r = ${v}%</text>
      <text x="${cx}" y="244" text-anchor="middle" font-size="12" fill="var(--muted)">紅色區域：增厚的平滑肌與水腫黏膜 · 黃色：黏液栓</text>
      <text x="345" y="22" text-anchor="middle" font-size="12" fill="var(--muted)">通過的氣流</text>${arr}
      ${arrows===0?'<text x="345" y="125" text-anchor="middle" font-size="13" fill="var(--path)" font-weight="700">幾乎沒有氣流</text>':''}`;
    $('#pm',pane).innerHTML=
      meter('阻力倍數',Math.log10(R),Math.log10(256),'×'+(R<10?R.toFixed(1):Math.round(R)))+
      meter('呼吸功',effort,4,Math.round(effort*25)+'%')+
      meter('可通過氣流',flow,1,Math.round(flow*100)+'%','acc')+
      meter('喘鳴音量',wheeze,1,Math.round(wheeze*100)+'%','acc');
    let s,cls,t;
    if(v>=85){s='正常或輕微';cls='ok';t='氣流順暢，幾乎聽不到喘鳴。';}
    else if(v>=65){s='輕到中度：呼氣性喘鳴';cls='mid';t='阻力上升數倍，病人需要多出力，吐氣時氣道更窄，所以先聽到呼氣性喘鳴。';}
    else if(v>=40){s='重度：喘鳴明顯、呼吸功大增';cls='bad';t='阻力上升到數倍至二十多倍，即使病人用盡力氣，氣流也開始下降。說話斷句、使用輔助肌。';}
    else {s='危及生命：silent chest';cls='bad';t='阻力極高，幾乎沒有氣流通過，所以喘鳴「消失」了。這不是好轉。';}
    $('#ps',pane).className='status '+cls; $('#ps',pane).textContent=s; $('#pt',pane).textContent=t;
  };
  r.oninput=draw; draw();
},

/* COPD：空氣滯留 */
trapping(pane){
  pane.innerHTML=`<div class="model">
    <div class="stack" style="gap:12px">
      <div class="viz"><svg id="tv" viewBox="0 0 540 250" role="img" aria-label="肺容積隨時間變化"></svg></div>
      <div class="formula" id="tf"></div>
    </div>
    <div class="ctl card">
      ${slider('trr','呼吸速率（次/分）',6,36,1,14,'自主呼吸變快，或 BVM 擠太快')}
      ${slider('ttau','呼氣時間常數 τ（秒）',0.3,2.0,0.1,0.4,'τ = 阻力 × 順應性。正常約 0.4 s；COPD／重度氣喘可達 1 s 以上')}
      <div class="toggles"><button class="chip" data-p="norm">正常肺</button><button class="chip" data-p="copd">COPD 惡化</button><button class="chip" data-p="bvm">COPD＋BVM 擠太快</button></div>
      <div class="meters" id="tm"></div>
      <div class="status" id="ts"></div>
      ${advBox('估算 auto-PEEP 時假設呼吸系統順應性 60 mL/cmH₂O、潮氣量 500 mL、吸吐比 1:2。auto-PEEP 越高，病人每次吸氣前要先克服的壓力越大，胸內壓也越高，靜脈回流越少。')}
    </div></div>`;
  const rr=$('#trr',pane), tau=$('#ttau',pane);
  const draw=()=>{
    const RR=+rr.value, T=+tau.value; $('#trro',pane).textContent=RR; $('#ttauo',pane).textContent=T.toFixed(1)+' s';
    const Vt=500, cyc=60/RR, Ti=cyc/3, Te=cyc*2/3, dt=0.02, nb=8;
    let V=0, t=0, pts=[], ee=[];
    for(let b=0;b<nb;b++){
      for(let x=0;x<Ti;x+=dt){V+=Vt/Ti*dt;t+=dt;pts.push([t,V]);}
      for(let x=0;x<Te;x+=dt){V*=Math.exp(-dt/T);t+=dt;pts.push([t,V]);}
      ee.push(V);
    }
    const k=Math.exp(-Te/T), trapSS=Vt*k/(1-k);
    const peep=trapSS/60;
    const ymax=Math.max(900,trapSS+Vt+100), W=540,H=250,L=48,B=210,TOP=14;
    const sx=x=>L+x/t*(W-L-12), sy=y=>B-y/ymax*(B-TOP);
    const path=pts.filter((_,i)=>i%2===0).map((p,i)=>(i?'L':'M')+sx(p[0]).toFixed(1)+' '+sy(p[1]).toFixed(1)).join('');
    const area=`M${sx(0)} ${sy(0)} `+ee.map((v,i)=>`L${sx((i+1)*cyc)} ${sy(v)}`).join(' ')+` L${sx(t)} ${sy(0)} Z`;
    let grid=''; for(let g=0;g<=ymax;g+=ymax>1500?500:250){grid+=`<line x1="${L}" x2="${W-12}" y1="${sy(g)}" y2="${sy(g)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${sy(g)+4}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="var(--mono)">${g}</text>`;}
    $('#tv',pane).innerHTML=`${grid}
      <path d="${area}" fill="var(--path)" opacity=".16"/>
      <path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2.2"/>
      ${ee.map((v,i)=>`<circle cx="${sx((i+1)*cyc)}" cy="${sy(v)}" r="3.5" fill="var(--path)"/>`).join('')}
      <text x="${L}" y="${B+18}" font-size="11" fill="var(--muted)">0</text><text x="${W-12}" y="${B+18}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="var(--mono)">${t.toFixed(0)} 秒</text>
      <text x="${L+4}" y="${TOP+8}" font-size="11" fill="var(--muted)">高於原本 FRC 的容積（mL）· 紅點＝每次呼氣結束時殘留的氣</text>`;
    $('#tf',pane).textContent=`呼氣時間 ${Te.toFixed(2)} s ÷ τ ${T.toFixed(1)} s = ${(Te/T).toFixed(1)} 個時間常數（約需 3 個才能吐乾淨 95%）`;
    $('#tm',pane).innerHTML=
      meter('滯留容積',trapSS,1500,Math.round(trapSS)+' mL')+
      meter('估計 auto-PEEP',peep,20,peep.toFixed(1)+' cmH₂O')+
      meter('靜脈回流',clamp(100-peep*4,10,100),100,Math.round(clamp(100-peep*4,10,100))+'%','good');
    const s=$('#ts',pane);
    if(trapSS<60){s.className='status ok';s.textContent='每次都能吐乾淨，沒有明顯空氣滯留。';}
    else if(peep<6){s.className='status mid';s.textContent='開始有空氣滯留：每一口都疊在沒吐完的氣上。';}
    else {s.className='status bad';s.textContent='嚴重動態過度充氣：吸氣功大增、胸內壓高、血壓可能下降。試著把呼吸速率調慢。';}
  };
  rr.oninput=draw; tau.oninput=draw;
  pane.querySelector('.toggles').onclick=e=>{const b=e.target.closest('[data-p]');if(!b)return;
    const p={norm:[14,0.4],copd:[24,1.2],bvm:[30,1.6]}[b.dataset.p]; rr.value=p[0]; tau.value=p[1]; draw();};
  draw();
},

      ${slider('spi','血漿膠體滲透壓 πc（mmHg）',14,30,1,25,'低白蛋白（營養不良、腎病、肝病）時下降')}
      <div class="toggles">${tog('sgtn','GTN')}${tog('scpap','CPAP')}${tog('ssit','坐姿雙腳下垂')}</div>
      <div class="meters" id="sm"></div>
      <div class="status" id="ss"></div>
      ${advBox('教學簡化模型：間質靜水壓 −2、間質膠體滲透壓 14 mmHg；淋巴可排除約 9 mmHg 的淨過濾壓（對應 Pc ≈18 開始間質水腫、≈25 肺泡水腫）。GTN 以降低 Pc 約 7 mmHg、CPAP 以提高間質壓並降低 Pc、坐姿以降低 Pc 約 2 mmHg 表示。CPAP 的主要效益是撐開肺泡改善分流與降低前後負荷，對液體濾出量的直接影響有限。真實數值因人而異。')}
    </div></div>`;
  const pc=$('#spc',pane), pi=$('#spi',pane);
  const draw=()=>{
    const Pc0=+pc.value, Pic=+pi.value; $('#spco',pane).textContent=Pc0; $('#spio',pane).textContent=Pic;
    let Pc=Pc0, Pi=-2; const PiI=14;
    if(on(pane,'sgtn')) Pc-=7; if(on(pane,'ssit')) Pc-=2; if(on(pane,'scpap')){Pi+=3;Pc-=2;}
    Pc=Math.max(Pc,4);
    const net=(Pc-Pi)-(Pic-PiI);
    const inter=clamp((net-9)/7,0,1), alv=clamp((net-16)/10,0,1);
    const nA=clamp(Math.round(net/2),0,8);
    let arrows=''; for(let k=0;k<nA;k++){const x=70+k*48; arrows+=`<path d="M${x} 196 v-46" stroke="var(--accent)" stroke-width="3" marker-end="url(#ah2)"/>`;}
    const fillH=alv*110;
    $('#sv',pane).innerHTML=`
      <defs><marker id="ah2" viewBox="0 0 10 10" refX="5" refY="8" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--accent)"/></marker>
      <clipPath id="alvc"><circle cx="420" cy="80" r="62"/></clipPath></defs>
      <rect x="20" y="132" width="500" height="58" fill="var(--accent)" opacity="${0.06+inter*0.32}" rx="6"/>
      <text x="30" y="150" font-size="12" fill="var(--muted)">間質</text>
      <rect x="20" y="196" width="500" height="44" rx="22" fill="var(--path-soft)" stroke="var(--path)" stroke-width="2"/>
      <text x="40" y="223" font-size="13" fill="var(--path)" font-weight="700">肺微血管 Pc ${Pc}</text>
      ${arrows}
      <circle cx="420" cy="80" r="62" fill="var(--surface)" stroke="var(--muted)" stroke-width="2"/>
      <rect x="350" y="${142-fillH}" width="140" height="${fillH}" fill="var(--accent)" opacity=".55" clip-path="url(#alvc)"/>
      <text x="420" y="84" text-anchor="middle" font-size="13" fill="var(--ink)" font-weight="700">肺泡</text>
      <text x="420" y="102" text-anchor="middle" font-size="11" fill="var(--muted)">${alv>0?'液體淹入':'含氣'}</text>
      <text x="30" y="30" font-size="12" fill="var(--muted)">藍色箭頭：液體從微血管滲出</text>`;
    $('#sf',pane).textContent=`淨過濾壓 = (${Pc} − (${Pi})) − (${Pic} − ${PiI}) = ${net} mmHg`;
    $('#sm',pane).innerHTML=meter('淨過濾壓',clamp(net,0,25),25,net+' mmHg')+meter('淋巴排除能力',9,25,'≈9')+meter('肺泡淹水',alv,1,Math.round(alv*100)+'%');
    const s=$('#ss',pane);
    if(net<=9){s.className='status ok';s.textContent='淋巴可以排除：沒有肺水腫。';}
    else if(net<=16){s.className='status mid';s.textContent='間質水腫：喘、端坐呼吸，可能出現 cardiac wheeze，濕囉音還不多。';}
    else {s.className='status bad';s.textContent='肺泡水腫：濕囉音、粉紅泡沫痰、分流造成的嚴重低血氧。';}
  };
  pc.oninput=draw; pi.oninput=draw; ['sgtn','scpap','ssit'].forEach(id=>bindTog(pane,id,draw));
  pc.value=26; draw();
},

/* 過敏：adrenaline 受體 */
adrenaline(pane){
  pane.innerHTML=`<div class="model">
    <div class="stack" style="gap:12px">
      <div class="viz"><svg id="av" viewBox="0 0 540 250" role="img" aria-label="Adrenaline 受體與作用"></svg></div>
      <p class="muted" style="font-size:.9rem">先拉嚴重度，再逐一打開 adrenaline 的受體作用，看看哪一條戰線被處理。最後試試只給抗組織胺或類固醇。</p>
    </div>
    <div class="ctl card">
      ${slider('asev','反應嚴重度',1,3,1,3,'1 輕微 · 2 中度 · 3 重度（休克＋氣道受累）')}
      <div><b style="font-size:.9rem">Adrenaline 作用</b><div class="toggles" style="margin-top:6px">${tog('aa1','α1')}${tog('ab1','β1')}${tog('ab2','β2')}</div></div>
      <div><b style="font-size:.9rem">其他藥物</b><div class="toggles" style="margin-top:6px">${tog('ah1','抗組織胺')}${tog('ast','類固醇')}</div></div>
      <div class="meters" id="am"></div>
      <div class="status" id="as"></div>
    </div></div>`;
  const sev=$('#asev',pane);
  const draw=()=>{
    const s=+sev.value; $('#asevo',pane).textContent=['','輕微','中度','重度'][s];
    const A1=on(pane,'aa1'),B1=on(pane,'ab1'),B2=on(pane,'ab2'),H1=on(pane,'ah1');
    let vaso=s*30, leak=s*30, bron=s*28, med=s*30, skin=s*30;
    if(A1){vaso*=.4;leak*=.5;skin*=.8;}
    if(B2){bron*=.35;med*=.35;leak*=.85;}
    if(H1){skin*=.5;}
    const co=B1?18:0;
    const MAP=clamp(Math.round(93-vaso*.42-leak*.18+co),35,95);
    const L=(x,c)=>`<line x1="150" y1="${x}" x2="330" y2="${c}" stroke="var(--ok)" stroke-width="2.5"/>`;
    $('#av',pane).innerHTML=`
      <text x="20" y="22" font-size="12" fill="var(--muted)">受體</text><text x="340" y="22" font-size="12" fill="var(--muted)">處理的病理</text>
      ${[['α1',A1,60],['β1',B1,125],['β2',B2,190]].map(([n,o,y])=>`<rect x="20" y="${y-24}" width="130" height="48" rx="8" fill="${o?'var(--ok-soft)':'var(--bg)'}" stroke="${o?'var(--ok)':'var(--line)'}" stroke-width="2"/><text x="85" y="${y+6}" text-anchor="middle" font-size="18" font-weight="700" fill="${o?'var(--ok)':'var(--muted)'}" font-family="var(--mono)">${n}</text>`).join('')}
      ${A1?L(60,50)+L(60,95):''}${B1?L(125,140):''}${B2?L(190,185)+L(190,228):''}
      ${[['血管收縮 → 升壓',50],['減輕黏膜水腫',95],['心輸出量 ↑',140],['支氣管擴張',185],['穩定肥大細胞',228]].map(([t,y])=>`<rect x="330" y="${y-16}" width="190" height="32" rx="6" fill="var(--surface)" stroke="var(--line)"/><text x="342" y="${y+5}" font-size="13" fill="var(--ink)">${t}</text>`).join('')}`;
    $('#am',pane).innerHTML=
      meter('平均動脈壓',MAP,100,MAP+' mmHg','good')+
      meter('血管擴張',vaso,90,Math.round(vaso)+'')+
      meter('外滲／水腫',leak,90,Math.round(leak)+'')+
      meter('支氣管收縮',bron,90,Math.round(bron)+'')+
      meter('持續釋放介質',med,90,Math.round(med)+'')+
      meter('皮膚症狀',skin,90,Math.round(skin)+'');
    const st=$('#as',pane);
    if(A1&&B1&&B2){st.className='status ok';st.textContent='Adrenaline 完整作用：同時處理循環、氣道與介質釋放。';}
    else if(H1&&!A1&&!B2){st.className='status bad';st.textContent='只有皮膚症狀改善，休克與氣道問題都還在。';}
    else if(on(pane,'ast')&&!A1&&!B2){st.className='status bad';st.textContent='類固醇在急性期沒有即時效果。';}
    else if(MAP<65){st.className='status bad';st.textContent='仍處於休克：平均動脈壓 < 65 mmHg。';}
    else {st.className='status mid';st.textContent='部分改善，但還有戰線沒有被處理。';}
  };
  sev.oninput=draw; ['aa1','ab1','ab2','ah1','ast'].forEach(id=>bindTog(pane,id,draw)); draw();
},

/* 張力性氣胸 */
tension(pane){
  pane.innerHTML=`<div class="model">
    <div class="stack" style="gap:12px">
      <div class="viz"><svg id="xv" viewBox="0 0 440 300" role="img" aria-label="胸腔正面示意"></svg></div>
      <div class="toggles"><button class="btn sm primary" id="xplay">讓時間流逝</button>${tog('xppv','正壓通氣中')}<button class="btn sm" id="xdec">胸腔減壓</button><button class="btn sm" id="xreset">重設</button></div>
    </div>
    <div class="ctl card">
      ${slider('xp','右側胸膜腔壓力（cmH₂O）',-5,25,1,-5,'正常為負壓；張力性氣胸時變成持續正壓')}
      ${vitalsHtml({HR:0,BP:0,SpO2:0}).replace(/<b>0<\/b>/g,'<b>–</b>')}
      <div class="meters" id="xm"></div>

    const dx=sh*48;
    $('#xv',pane).innerHTML=`
      <rect x="40" y="30" width="360" height="250" rx="70" fill="var(--bg)" stroke="var(--line)" stroke-width="2"/>
      <rect x="44" y="34" width="${170+dx*.5}" height="242" rx="66" fill="var(--soft)" opacity="${col}"/>
      <ellipse cx="${118}" cy="160" rx="${70*(1-col*.78)}" ry="${105*(1-col*.6)}" fill="var(--path-soft)" stroke="var(--path)" stroke-width="2"/>
      <ellipse cx="${325+dx*.25}" cy="160" rx="${68*(1-sh*.28)}" ry="105" fill="var(--path-soft)" stroke="var(--path)" stroke-width="2"/>
      <path d="M${220} 6 C ${220} 40, ${220+dx} 60, ${220+dx} 90" fill="none" stroke="var(--muted)" stroke-width="10" stroke-linecap="round"/>
      <ellipse cx="${232+dx}" cy="200" rx="40" ry="46" fill="var(--path)" opacity=".75"/>
      <text x="${232+dx}" y="205" text-anchor="middle" font-size="12" fill="#fff" font-weight="700">心臟</text>
      <text x="118" y="295" text-anchor="middle" font-size="12" fill="var(--muted)">患側（右）</text>
      <text x="325" y="295" text-anchor="middle" font-size="12" fill="var(--muted)">健側（左）</text>
      ${col>.3?`<text x="80" y="60" font-size="12" fill="var(--accent)" font-weight="700">胸膜腔內的空氣</text>`:''}
      ${sh>.4?`<text x="${236+dx}" y="120" font-size="12" fill="var(--path)" font-weight="700">縱膈腔推移</text>`:''}`;
    const vit=$$('.vital b',pane); vit[0].textContent=hr; vit[1].textContent=sbp+'/'+Math.round(sbp*.62); vit[2].textContent=spo2+'%';
    $$('.vital',pane).forEach((el,i)=>el.classList.toggle('bad',[hr>120,sbp<90,spo2<92][i]));
    $('#xm',pane).innerHTML=meter('右肺塌陷',col,1,Math.round(col*100)+'%')+meter('縱膈腔推移',sh,1,Math.round(sh*100)+'%')+meter('回心血量',VR,100,Math.round(VR)+'%','good');
    const s=$('#xs',pane);
    if(P<0){s.className='status ok';s.textContent='胸膜腔維持負壓，肺可以擴張。';}
    else if(P===0){s.className='status mid';s.textContent='張力已解除，回心血量恢復；但仍是氣胸，肺尚未完全擴張。持續監測導管是否失效。';}
    else if(P<=6){s.className='status mid';s.textContent='氣胸、肺部分塌陷：缺氧與喘為主，循環尚可。';}

  $('#xdec',pane).onclick=()=>{p.value=0;draw();};
