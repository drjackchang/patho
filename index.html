/* 換氣過度 */
hypocapnia(pane){
  pane.innerHTML=`<div class="model">
    <div class="stack" style="gap:12px">
      <div class="viz"><svg id="hv" viewBox="0 0 540 150" role="img" aria-label="pH 數線"></svg></div>
      <div class="formula" id="hf"></div>
      <div class="card stack" style="gap:6px;padding:14px 16px"><b style="font-size:.92rem">此時可能出現的症狀</b><ul class="whylist" id="hsym" style="color:var(--ink)"></ul></div>
    </div>
    <div class="ctl card">
      ${slider('hva','肺泡通氣量（相對正常）',0.6,3,0.1,1,'1.0× = 正常；2.0× = 換氣量加倍')}
      <div class="toggles">${tog('hdka','切換成 DKA 病人（HCO₃⁻ 10）')}</div>
      <div class="meters" id="hm"></div>
      <div class="status" id="hs"></div>
      ${advBox('PaCO₂ ≈ 40 ÷ 通氣量倍數；急性期 PaCO₂ 每下降 10 mmHg，HCO₃⁻ 約降 2；每上升 10 mmHg 約升 1；游離鈣約隨 pH 每上升 0.1 下降 0.05 mmol/L；腦血流約隨 PaCO₂ 每 1 mmHg 改變 2.5%。皆為教學近似值。')}
    </div></div>`;
  const va=$('#hva',pane);
  const draw=()=>{
    const m=+va.value; $('#hvao',pane).textContent=m.toFixed(1)+'×';
    const dka=on(pane,'hdka');
    const pa=40/m;
    const hco3=dka?10:(pa<40?24-0.2*(40-pa):24+0.1*(pa-40));
    const ph=6.1+Math.log10(hco3/(0.03*pa));
    const ica=clamp(1.20-0.5*(ph-7.40),0.8,1.45);
    const cbf=clamp(100+2.5*(pa-40),40,160);
    const sx=x=>30+(clamp(x,6.8,7.8)-6.8)/1.0*480;
    $('#hv',pane).innerHTML=`
      <rect x="${sx(6.8)}" y="60" width="${sx(7.35)-sx(6.8)}" height="22" fill="var(--path)" opacity=".18"/>
      <rect x="${sx(7.35)}" y="60" width="${sx(7.45)-sx(7.35)}" height="22" fill="var(--ok)" opacity=".3"/>
      <rect x="${sx(7.45)}" y="60" width="${sx(7.8)-sx(7.45)}" height="22" fill="var(--accent)" opacity=".18"/>
      ${[6.8,7.0,7.2,7.4,7.6,7.8].map(v=>`<text x="${sx(v)}" y="102" text-anchor="middle" font-size="11" fill="var(--muted)" font-family="var(--mono)">${v.toFixed(1)}</text>`).join('')}
      <text x="${sx(7.05)}" y="52" text-anchor="middle" font-size="12" fill="var(--path)">酸中毒</text>
      <text x="${sx(7.4)}" y="52" text-anchor="middle" font-size="12" fill="var(--ok)">正常</text>
      <text x="${sx(7.62)}" y="52" text-anchor="middle" font-size="12" fill="var(--accent)">鹼中毒</text>
      <path d="M${sx(ph)} 56 l-8 -14 h16 z" fill="var(--ink)"/>
      <line x1="${sx(ph)}" x2="${sx(ph)}" y1="58" y2="86" stroke="var(--ink)" stroke-width="2.5"/>
      <text x="${sx(ph)}" y="132" text-anchor="middle" font-size="15" font-weight="700" fill="var(--ink)" font-family="var(--mono)">pH ${ph.toFixed(2)}</text>`;
    $('#hf',pane).textContent=`pH = 6.1 + log( ${hco3.toFixed(1)} ÷ (0.03 × ${pa.toFixed(0)}) ) = ${ph.toFixed(2)}`;
    $('#hm',pane).innerHTML=
      meter('PaCO₂',pa,80,pa.toFixed(0)+' mmHg','acc')+
      meter('HCO₃⁻',hco3,30,hco3.toFixed(1),'acc')+
      meter('游離鈣',ica-0.8,0.65,ica.toFixed(2),'good')+
      meter('腦血流',cbf,160,Math.round(cbf)+'%','good');
    const sym=[];
    if(!dka){
      if(pa<32) sym.push('頭暈、輕飄感（腦血管收縮）');
      if(pa<28) sym.push('口周與手指發麻');
      if(pa<24) sym.push('胸悶、覺得吸不到氣、更焦慮');
      if(pa<20) sym.push('手足抽搐（爪狀手）、視力模糊、暈厥前感');
      if(pa>48) sym.push('CO₂ 上升：頭痛、嗜睡（換氣不足）');
    } else {
      if(ph<7.2) sym.push('嚴重酸中毒：心肌抑制、心律不整風險、意識變差');
      else if(ph<7.3) sym.push('酸中毒：病人需要持續深快呼吸來代償');
      else sym.push('深快呼吸正在把 pH 撐住');
    }
    $('#hsym',pane).innerHTML=sym.length?sym.map(x=>`<li>${x}</li>`).join(''):'<li>沒有明顯症狀</li>';
    const s=$('#hs',pane);
    if(dka){
      if(m<1.8){s.className='status bad';s.textContent='DKA 病人如果呼吸「慢下來」，pH 會大幅下降。Kussmaul 呼吸是代償，不能阻止。';}
      else {s.className='status mid';s.textContent='高通氣量把 PaCO₂ 壓低，抵銷代謝性酸中毒。EtCO₂ 很低，但這是身體在自救。';}
    } else if(ph>7.5){s.className='status bad';s.textContent='呼吸性鹼中毒：游離鈣下降、腦血流減少。';}
    else if(ph>7.45){s.className='status mid';s.textContent='輕度呼吸性鹼中毒：可能開始頭暈、發麻。';}
    else if(ph<7.35){s.className='status bad';s.textContent='換氣不足：呼吸性酸中毒。';}
    else {s.className='status ok';s.textContent='酸鹼值在正常範圍。';}
  };
  va.oninput=draw; bindTog(pane,'hdka',draw); va.value=2.2; draw();
}
};

    </div>`}).join('');
  };
  $('#vgs').onclick=e=>{ if(e.target.id==='vgr'){for(const k in V)delete V[k];vg();return;} const b=e.target.closest('[data-v]');if(!b||b.disabled)return;V[+b.dataset.v]=b.dataset.a;vg();};
  vg();
}

}

  <section id="p1" class="stack" style="gap:24px">
    <div class="parthead"><span class="mono">PART 1</span><h2>在臨床現場帶實習生做病理推理</h2></div>

    <div class="stack" style="gap:10px"><h3 id="s-1-1" class="anch">1.1 為什麼現場要教病理，而不只教流程</h3>
      <div class="prose stack" style="gap:10px">
        <p>學員背得出指引，卻常在不典型的病人身上卡住。研究顯示，理解基礎科學機轉的學習者能把零散的症狀連成有意義的整體，在延後測驗與不熟悉的案例上表現較好${cite('woods')}。專家的病理知識會逐漸「封裝」成疾病腳本（illness scripts），所以專家看起來是憑直覺；初學者還沒有腳本，需要把機轉展開來推${cite('schmidt','charlin')}。</p>
        <p>救護現場的推理有它的特性：從派遣資訊就開始了，受到時間壓力、環境與旁人影響；好的救護推理需要維持整體觀、保持開放的心態，並且從批評與回饋中進步${cite('andersson')}。專家與新手蒐集與處理資訊的方式本來就不同${cite('perona')}，指導員的工作，就是把自己已經自動化的推理說出來，讓學員看得見。</p>
      </div>
    </div>

    <div class="stack" style="gap:10px"><h3 id="s-1-2" class="anch">1.2 一趟出勤的教學循環</h3>
      <p class="muted prose">不是每個時間點都適合教。病人不穩定時，指導員的第一責任是病人；教學放在穩定的空檔。</p>
      <div class="tl">${[
        ['出勤前','派遣到出發途中，1–2 分鐘','<b>預測</b>：依派遣內容請學員說出 2–3 個可能的機轉，以及到場要找哪些線索來分辨。這是在啟動疾病腳本'+cite('andersson','charlin')+'。同時提醒：派遣資訊可能讓人錨定，到場後要重新打開'+cite('croskerry')+'。'],
        ['現場','病人照護優先','<b>看見</b>：依學員層級分派任務（例如由學員主導評估、指導員負責安全）。只用短提示，例如「說出你看到的三個重點」。除非有安全疑慮，不在病人與家屬面前糾正。學員負荷過高時直接接手，事後再教'+cite('cognitive')+'。'],
        ['轉送途中','病人穩定時','<b>解釋、驗證</b>：請學員一邊再評估一邊出聲思考（think-aloud）：這個數字代表什麼？和我們的處置預期一致嗎？指導員也可以示範自己的出聲思考'+cite('pinnock')+'。'],
        ['交班後','返隊途中，5–10 分鐘','<b>回顧推理</b>：用 One-Minute Preceptor 或 SNAPPS 快速回顧'+cite('neher','wolpaw')+'，把這個病人連回網站上的機轉因果鏈。觀察學員卡在哪一類推理困難（見 1.5）。'],

        ['下次出勤前','隔幾天','<b>提取練習</b>：不看資料，請學員講上次病人的機轉鏈。間隔一段時間的提取練習，比重讀更能留住知識'+cite('larsen')+'。']
      ].map(([a,b,c])=>`<div class="tli"><b>${a}</b><span class="tag">${b}</span><p>${c}</p></div>`).join('')}</div>
    </div>

    <div class="stack" style="gap:10px"><h3 id="s-1-3" class="anch">1.3 教學法工具箱</h3>
      <div class="grid2" style="align-items:start">
        ${tool('認知學徒制',cite('collins'),'把專家看不見的思考變成看得見：示範（modeling）、教練（coaching）、鷹架與逐步撤除（scaffolding、fading）、要學員說出來（articulation）、反思（reflection）、自己探索（exploration）。','前幾次出勤由指導員主導並出聲思考；接著讓學員主導評估，指導員只在必要時提示；最後讓學員獨立完成，指導員事後回顧。')}
        ${tool('One-Minute Preceptor',cite('neher'),'五個微技巧：要學員表態、追問支持的證據、教一個通則、具體肯定做對的地方、修正錯誤。','返隊途中：「你覺得是什麼？為什麼？」「哪個線索最關鍵？」「這類病人的通則是⋯⋯」「你注意到 EtCO₂ 很好」「下次要先排除低血糖」。')}
        ${tool('SNAPPS',cite('wolpaw'),'由學員主導的報告：摘要、縮小鑑別、分析、提出不確定處、處置計畫、選一個議題自學。','適合已有基礎的實習生。最後一步選出的議題，直接對應網站的主題，成為當天的研讀整理。')}

        ${tool('問題表徵',cite('bowen'),'用一句話、帶有語意修飾詞（急性／慢性、進行性、單側／雙側）總結病人，是推理品質的指標。','交班前請學員先對指導員說一句話版本，例如「72 歲男性，夜間急性端坐呼吸，高血壓合併雙側濕囉音」。說不出來，代表還沒整合。')}
        ${tool('自我解釋',cite('chamberland'),'學員對每個發現解釋「為什麼會出現」，對不熟悉的主題特別能提升之後的診斷表現。','遇到少見的病人時，請學員逐一解釋每個異常生命徵象的機轉，再對照網站的機轉因果鏈。')}

        ${tool('認知偏誤',cite('croskerry'),'快速直覺與慢速分析兩種思考都會出錯；常見偏誤有錨定、過早結論、只要找到一個答案就停止搜尋。','「路倒酒醉」是經典陷阱。教學員固定問一句：「如果不是這個，最危險的會是什麼？」並且一定要測血糖。')}

    <div class="stack" style="gap:10px"><h3 id="s-1-4" class="anch">1.4 現場提問示範</h3>
      <div style="overflow-x:auto"><table class="rub wide"><thead><tr><th>推理步驟</th><th>可以問的話</th><th>學員卡住時的鷹架</th></tr></thead><tbody>
        ${[
          ['看見','「進門第一眼，你覺得他穩不穩？為什麼？」','「先看呼吸功、膚色、意識，各說一個字。」'],
          ['解釋','「這幾個發現，哪一條機轉可以同時解釋？」','「如果只能選一個器官系統，你選哪個？」'],

          ['介入','「這個處置打在機轉鏈的哪一環？」','「不做這個處置，哪一環會繼續惡化？」'],

      </tbody></table></div>
      <div class="card stack" style="gap:8px"><b>示範對話：派遣「路倒，疑似酒醉」</b>
        <div class="dlg">
          <p><b>出發前　CI</b>：派遣說酒醉。除了酒醉，還有哪些會讓人倒在路邊、看起來像喝醉？</p>
          <p><b>學員</b>：低血糖、頭部外傷、中風……還有鴉片類中毒。</p>
          <p><b>CI</b>：到場你要找哪個線索來分辨？</p>
          <p><b>學員</b>：測血糖、看頭部有沒有傷、瞳孔、呼吸速率。</p>
          <p><b>返隊　CI</b>：血糖 2.1，給口服葡萄糖後醒了。用一句話說這個病人。</p>
          <p><b>學員</b>：中年男性，糖尿病用藥中，急性意識改變，原因是低血糖，處置後改善。</p>
          <p><b>CI</b>：很好，你沒有被派遣資訊錨定。通則是：意識改變一律測血糖。下一個問題：他吃的是什麼降血糖藥？為什麼這會影響他能不能不送醫？今天的研讀整理就做「低血糖」。</p>
        </div>
      </div>

    <div class="stack" style="gap:10px"><h3 id="s-1-5" class="anch">1.5 學員卡在哪裡：推理困難的診斷與介入</h3>
      <p class="muted prose">Audétat 等人把臨床推理困難整理成五類，並提出對應的介入方式${cite('audetat13','audetat17')}。指導員先「診斷」學員卡在哪一類，再選教法。</p>
      <div style="overflow-x:auto"><table class="rub wide"><thead><tr><th>困難類型</th><th>現場看到的樣子</th><th>介入</th><th>網站可用資源</th></tr></thead><tbody>
        ${[
          ['產生假設與蒐集資料','問診與檢查沒有方向，什麼都問或漏掉關鍵','出發前先要學員列假設，到場依假設蒐集','鑑別練習頁：先選線索再看支持度'],
          ['過早結論','聽到派遣就定案，忽略不符合的線索','固定追問「如果不是這個，最危險的是什麼？」','病例推理中後段翻轉的階段'],
          ['排優先順序','處理次要問題，延誤致命問題','用 XABCDE 與「哪一環最快致命」排序','臨床評估流程、處置模擬'],

        ].map(r=>`<tr>${r.map((x,i)=>i?`<td>${x}</td>`:`<th scope="row">${x}</th>`).join('')}</tr>`).join('')}
      </tbody></table></div>
    </div>

    <div class="stack" style="gap:10px"><h3 id="s-1-6" class="anch">1.6 評量與紀錄</h3>
      <div class="grid2" style="align-items:start">
        <div class="card stack" style="gap:8px"><h4>RIME 架構${cite('pangaro')}</h4>
          <ul class="stack" style="margin:0;padding-left:1.2em;gap:4px;font-size:.95rem">
            <li><b>Reporter</b>：能正確蒐集並報告資料。</li>
            <li><b>Interpreter</b>：能解釋發現、提出鑑別。</li>
            <li><b>Manager</b>：能提出合理處置計畫。</li>
            <li><b>Educator</b>：能自主學習並教別人。</li>
          </ul><p class="muted" style="font-size:.9rem">實習初期多在 Reporter；病理推理教學的目標，是把學員推到 Interpreter 與 Manager。</p></div>
        <div class="card stack" style="gap:8px"><h4>信任委付程度${cite('tencate')}</h4>
          <ol class="stack" style="margin:0;padding-left:1.2em;gap:4px;font-size:.95rem">
            <li>只觀察，不執行。</li>
            <li>在指導員直接監督下執行。</li>
            <li>指導員在旁，必要時介入。</li>
            <li>獨立執行，事後由指導員檢視。</li>
            <li>可以帶領新進人員。</li>
          </ol><p class="muted" style="font-size:.9rem">每一趟出勤，對「評估」「推理」「處置」分別記錄委付程度，比一個總分更有用。</p></div>

        <p class="muted" style="font-size:.94rem">派遣內容與出發前的假設；一句話問題表徵；最終判斷與機轉鏈；處置與驗證結果；推理困難類型（1.5）；RIME 與委付程度；指定的研讀主題。</p></div>
    </div>

    <div class="card stack" style="gap:8px;border-left:4px solid var(--path)"><h3 id="s-1-7" class="anch">1.7 法規與安全</h3>
      <p>實習生只能執行其已取得證照層級、且實習單位允許的項目，指導員不能授權超出範圍。每個主題的「台灣執行範圍」分頁，標出各處置在救護技術員管理辦法中的層級。教學時讓學員先說出「這個處置我這一級能不能做」，本身就是推理訓練。<a href="#scope">查看執行範圍總表</a></p>
    </div>
  </section>

  <section id="p2" class="stack" style="gap:24px">
    <div class="parthead"><span class="mono">PART 2</span><h2>指導員自己怎麼搞懂病理與教學</h2></div>

    <div class="stack" style="gap:10px"><h3 id="s-2-1" class="anch">2.1 先找出自己的弱點</h3>
      <p class="prose">到「綜合測驗」切換進階層，選全部系統、30 題做前測。答對率最低的兩個系統，就是你最先要補的地方。指導員也有專家盲點：很多推理已經自動化，自己做得到，卻說不出為什麼${cite('schmidt','dhaliwal')}。這份測驗也是在檢查你能不能說得出機轉。</p>
    </div>

    <div class="stack" style="gap:10px"><h3 id="s-2-2" class="anch">2.2 病理自學循環（每個主題約 45–60 分鐘）</h3>
      <div class="steps" style="grid-template-columns:repeat(5,1fr)">
        ${[
          ['先寫','不看網站，在「我的研讀整理」寫下自己的機轉鏈。自我解釋能促進理解'+cite('chamberland')+'。'],
          ['對照','讀機轉因果鏈與「為什麼這樣處置」，標出和自己版本不同的地方。'],
          ['練習','做病例推理與處置模擬，每一步都說出理由。'],
          ['提取','一週後不看資料重做測驗。間隔提取比重讀有效'+cite('larsen')+'。'],
          ['連回現場','把最近一次出勤回推到機轉鏈：哪一環我當時沒想到？這是刻意練習'+cite('ericsson')+'。']
        ].map(([k,d],i)=>`<div class="step"><span class="n">0${i+1}</span><b>${k}</b><span>${d}</span></div>`).join('')}
      </div>
      <div style="overflow-x:auto"><table class="rub wide"><thead><tr><th>週次</th><th>系統</th><th>建議搭配的鑑別練習</th></tr></thead><tbody>
        ${[
          ['1','評估（先建立共同語言）','—'],['2','呼吸系統','呼吸困難、兒童呼吸道急症'],['3','心臟系統','胸痛與心悸、心搏過緩'],
          ['4','心跳停止與復甦','心跳停止：找可逆原因'],['5','內科急症（一）','意識改變'],['6','內科急症（二）、精神與行為','休克與低血壓、抽搐與激躁'],
          ['7','創傷','創傷：找出隱藏的致命傷'],['8','中毒','中毒症候群'],['9','產科','孕產婦急症'],['10','弱點系統複習、後測','綜合測驗 30 題']
        ].map(r=>`<tr>${r.map((x,i)=>i?`<td>${x}</td>`:`<th scope="row">第 ${x} 週</th>`).join('')}</tr>`).join('')}
      </tbody></table></div>
    </div>

    <div class="stack" style="gap:10px"><h3 id="s-2-3" class="anch">2.3 從「會做」到「會教」</h3>
      <div class="grid2" style="align-items:start">
        <div class="card stack" style="gap:8px"><h4>練習自己的出聲思考</h4>
          <p style="font-size:.95rem">挑網站上的一個病例，錄下自己從第一階段到最後的口述推理（只用網站病例，不涉及真實病人資料）。回放時檢查：五個推理步驟是否都說出來了？每個處置是否都說出作用在哪一環？教推理的人，需要先能把自己的推理說清楚${cite('pinnock','dhaliwal')}。</p></div>
        <div class="card stack" style="gap:8px"><h4>同儕微型教學</h4>
          <p style="font-size:.95rem">兩位指導員一組，一人扮實習生、一人用 One-Minute Preceptor 帶一個網站病例，5 分鐘後交換。觀察者用下方檢核表回饋。臨床教學包含課前規劃、現場教學與事後反思三個階段，三者都需要練習${cite('ramani')}。</p></div>
      </div>
    </div>

    <div class="stack" style="gap:10px"><h3 id="s-2-4" class="anch">2.4 指導員讀書會（每次 90 分鐘）</h3>
      <div class="tl">${[
        ['0–15 分','機轉鏈主講','輪值的指導員不看投影片，口述當週一個主題的機轉鏈。'],
        ['15–35 分','病例出聲思考','一人用網站病例做出聲思考，其他人記下他跳過的推理步驟。'],
        ['35–65 分','討論題','用網站的討論題，先各自寫答案再對照「臨床指導員引導重點」。'],
        ['65–80 分','教學演練','兩兩用 One-Minute Preceptor 或 SNAPPS 演練一次，觀察者回饋。'],
        ['80–90 分','分工','決定下次主題，並分享最近一次現場帶學員遇到的推理困難類型。']
      ].map(([a,b,c])=>`<div class="tli"><b class="mono">${a}</b><span class="tag">${b}</span><p>${c}</p></div>`).join('')}</div>
    </div>

    <div class="card stack" style="gap:10px"><h3 id="s-2-5" class="anch">2.5 指導員自我檢核表</h3>
      <div class="chk" id="cichk">${[
        '出發前，我會請學員預測可能的機轉與要找的線索',
        '我會依學員層級分派任務，並在病人不穩時優先照護',
        '我在病人面前只用短提示，糾正留到適當時機',
        '轉送途中，我會請學員出聲思考並驗證處置效果',
        '返隊時，我會用 One-Minute Preceptor 或 SNAPPS 回顧',
        '我能說出學員卡在哪一類推理困難',
        '我的回饋具體、針對行為，並指出機轉鏈上的哪一環',
        '我會在下次出勤前做提取練習',
        '我會確認學員的處置在其證照層級的範圍內',
        '我自己能不看資料講出本月教學主題的機轉鏈'
      ].map((t,i)=>`<label><input type="checkbox" data-i="${i}"> ${t}</label>`).join('')}</div>
      <p class="muted" style="font-size:.86rem">勾選只會存在這台裝置的瀏覽器。</p>
    </div>

    <div class="stack" style="gap:10px"><h3 id="s-2-6" class="anch">2.6 作業報告評分量表</h3>
      <p class="muted prose">各主題的作業另有評分重點，可與這份量表合併使用。每項 1–4 分，總分 16 分。</p>
      <div style="overflow-x:auto"><table class="rub wide"><thead><tr><th>面向</th><th>4 優秀</th><th>3 良好</th><th>2 尚可</th><th>1 待加強</th></tr></thead><tbody>
        ${[
          ['病理正確性','機轉完整正確，能說明因果方向','大致正確，少數細節不精確','有明顯錯誤或缺環','機轉錯誤或未說明'],
          ['推理連結','每個表現與處置都對回機轉環節','多數有對應','對應零散','只列出處置，沒有理由'],
          ['證據與文獻','引用 2 篇以上原始文獻或官方指引並正確解讀','有引用但解讀較淺','只引用次級資料或網站','沒有引用'],
          ['在地化與反思','清楚對照台灣法規與實習單位規範，並連回實際出勤','有比較但較籠統','只描述差異','沒有比較或反思']
        ].map(r=>`<tr>${r.map((x,i)=>i?`<td>${x}</td>`:`<th scope="row">${x}</th>`).join('')}</tr>`).join('')}
      </tbody></table></div>
    </div>
  </section>

  <section id="refs" class="stack" style="gap:10px"><h2>參考文獻</h2>
    <ol class="refs">${REFS.map((r,i)=>`<li id="ref-${i+1}">${r[1]}</li>`).join('')}</ol>
    <p class="muted" style="font-size:.86rem">本網站內容是教學用的病理整理，不是臨床指引。藥物劑量、適應症與執行層級，以最新版 AV CPG、台灣救護相關法規及所屬機關規範為準。</p>
  </section>
  </div>`;
  const app=$('#app');
  const st=store.get('cichk',{});
  $$('#cichk input',app).forEach(cb=>{cb.checked=!!st[cb.dataset.i];cb.onchange=()=>{st[cb.dataset.i]=cb.checked;store.set('cichk',st);};});
  app.onclick=e=>{
    const j=e.target.closest('[data-jump]'); if(j){ const t=document.getElementById(j.dataset.jump); if(t) t.scrollIntoView({behavior:'smooth',block:'start'}); return; }
    const r=e.target.closest('[data-ref]'); if(r){ e.preventDefault(); const t=document.getElementById('ref-'+r.dataset.ref); if(t){t.scrollIntoView({behavior:'smooth',block:'center'}); t.classList.add('flash'); setTimeout(()=>t.classList.remove('flash'),1600);} }
  };
}

/* ================= ROUTER ================= */
function route(){
  const h=(location.hash||'#home').slice(1);
  $('#app').onclick=null;
  const pages={ddx:renderDDxIndex,quiz:renderQuizPage,instructor:renderInstructor,scope:renderScopePage};
  const isDdx=h.startsWith('ddx-');
  const navCur=isDdx?'ddx':pages[h]?h:(byId[h]?'':'home');
  renderNav(navCur); if(!byId[h]) renderBottom(navCur);
  if(byId[h]) renderCPG(byId[h]);
  else if(isDdx) renderDDx(h.slice(4));
  else if(pages[h]) pages[h]();
  else renderHome();
}
let lastHash=location.hash;
window.addEventListener('hashchange',()=>{route(); if(location.hash!==lastHash){window.scrollTo(0,0); lastHash=location.hash;}});
applyLevel(); route();
})();

</script>
</body>
</html>
